<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شكراً لطلبك - Tithkari</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --gold: #FFD700;
            --gold-light: #FFED4A;
            --dark: #0A0A14;
            --dark-light: #141425;
            --gray: #8A8A9B;
            --white: #FFFFFF;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--dark);
            color: var(--white);
            direction: rtl;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .thank-you-container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            background: #1A1A2E;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.6s ease;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .check-icon {
            font-size: 80px;
            color: #10b981;
            margin-bottom: 20px;
            display: block;
        }
        
        .thank-you-container h1 {
            color: var(--gold);
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
        }
        
        .thank-you-container .subtitle {
            color: var(--gray);
            font-size: 18px;
            margin-bottom: 15px;
        }
        
        .order-number {
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
        }
        
        .order-number .label {
            color: var(--gray);
            font-size: 14px;
        }
        
        .order-number .number {
            color: var(--gold);
            font-size: 24px;
            font-weight: 800;
            display: block;
            margin-top: 5px;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }
        
        .thank-you-container .message {
            color: var(--gray);
            font-size: 16px;
            line-height: 1.8;
            margin: 20px 0;
        }
        
        .thank-you-container .message i {
            color: var(--gold);
            margin: 0 4px;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 25px;
        }
        
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: var(--dark);
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            font-family: 'Cairo', sans-serif;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
        }
        
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            background: transparent;
            color: var(--white);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            font-family: 'Cairo', sans-serif;
        }
        
        .btn-secondary:hover {
            border-color: var(--gold);
            color: var(--gold);
            transform: translateY(-3px);
        }
        
        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            background: #25D366;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            font-family: 'Cairo', sans-serif;
        }
        
        .btn-whatsapp:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(37, 211, 102, 0.3);
        }
        
        .footer-note {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
        }
        
        @media (max-width: 480px) {
            .thank-you-container {
                padding: 30px 20px;
            }
            
            .thank-you-container h1 {
                font-size: 24px;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .action-buttons .btn-primary,
            .action-buttons .btn-secondary,
            .action-buttons .btn-whatsapp {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="thank-you-container">
        <i class="fas fa-check-circle check-icon"></i>
        
        <h1>✅ شكراً لطلبك!</h1>
        <p class="subtitle">تم استلام طلبك بنجاح</p>
        
        <div class="order-number">
            <span class="label">📋 رقم الطلب</span>
            <span class="number" id="orderNumber">---</span>
        </div>
        
        <p class="message">
            <i class="fas fa-envelope"></i> سيتم إرسال تأكيد الطلب إلى بريدك الإلكتروني<br />
            <i class="fas fa-phone"></i> سنتواصل معك قريباً لتأكيد التفاصيل
        </p>
        
        <div class="action-buttons">
            <a href="index.html" class="btn-primary">
                <i class="fas fa-arrow-right"></i> العودة للمتجر
            </a>
            <a href="design-studio.html" class="btn-secondary">
                <i class="fas fa-paint-brush"></i> تصميم درع جديد
            </a>
            <a href="#" class="btn-whatsapp" id="whatsappBtn">
                <i class="fab fa-whatsapp"></i> تواصل معنا
            </a>
        </div>
        
        <div class="footer-note">
            Tithkari 🛡️ - متجر الدروع الفاخرة
        </div>
    </div>

    <script>
        // ============================================
        // عرض رقم الطلب
        // ============================================
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order');
        if (orderId) {
            document.getElementById('orderNumber').textContent = orderId;
        }
        
        // ============================================
        // زر واتساب
        // ============================================
        document.getElementById('whatsappBtn').addEventListener('click', function(e) {
            e.preventDefault();
            const phone = localStorage.getItem('tithkari_whatsapp') || '966500000000';
            const message = encodeURIComponent(
                '🛡️ مرحباً، لقد قمت بطلب درع مخصص\n' +
                '📋 رقم الطلب: ' + (orderId || 'غير محدد') + '\n' +
                '📅 التاريخ: ' + new Date().toLocaleDateString('ar-SA')
            );
            window.open('https://wa.me/' + phone + '?text=' + message, '_blank');
        });
    </script>

</body>
</html>
