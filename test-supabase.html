<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار Supabase - Tithkari</title>
    
    <!-- أيقونة بسيطة لمنع خطأ favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e17;
            color: #fff;
            padding: 20px;
            direction: rtl;
        }
        .container { max-width: 900px; margin: 0 auto; }
        
        .header {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 15px;
            margin-bottom: 25px;
            border: 1px solid #2a2a4e;
        }
        .header h1 { 
            font-size: 2.2em; 
            color: #ffd700; 
            margin-bottom: 8px;
        }
        .header p { color: #8899aa; }
        
        .card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid #2a2a4e;
        }
        .card h3 {
            color: #ffd700;
            margin-bottom: 15px;
            font-size: 1.1em;
            border-bottom: 1px solid #2a2a4e;
            padding-bottom: 10px;
        }
        
        .badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            margin: 3px;
        }
        .badge-success { background: #00cc66; color: #fff; }
        .badge-error { background: #ff4444; color: #fff; }
        .badge-info { background: #2196F3; color: #fff; }
        .badge-warning { background: #ffaa00; color: #0a0e17; }
        
        .key-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            background: #0a0e17;
            border-radius: 6px;
            margin-bottom: 5px;
            font-size: 0.9em;
            flex-wrap: wrap;
            gap: 5px;
        }
        .key-name { color: #66b3ff; font-weight: bold; }
        .key-value { 
            color: #66ff88;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            max-width: 70%;
        }
        .key-value.hidden { color: #ff6666; }
        
        .product-item {
            background: #0a0e17;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #2a2a4e;
            transition: all 0.3s;
        }
        .product-item:hover {
            border-color: #ffd700;
            transform: translateX(-5px);
        }
        .product-name { color: #ffd700; font-size: 1.05em; }
        .product-price { color: #66ff88; font-weight: bold; }
        .product-category { color: #8899aa; font-size: 0.85em; }
        .product-id { color: #667788; font-size: 0.7em; }
        
        .btn {
            padding: 10px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }
        .btn-primary { background: #ffd700; color: #0a0e17; font-weight: bold; }
        .btn-primary:hover { background: #ffed4a; transform: scale(1.05); }
        .btn-secondary { background: #2a2a4e; color: #fff; }
        .btn-secondary:hover { background: #3a3a6e; transform: scale(1.05); }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: #667788;
            font-size: 0.9em;
        }
        
        .error-box {
            background: #2a1a1a;
            border: 1px solid #ff4444;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
        }
        .error-box h4 { color: #ff4444; margin-bottom: 8px; }
        .error-box ul { 
            color: #8899aa; 
            padding-right: 20px; 
            line-height: 1.8;
        }
        .error-box code {
            background: #0a0e17;
            padding: 2px 10px;
            border-radius: 4px;
            color: #ffd700;
        }
        
        .success-box {
            background: #0a2a1a;
            border: 1px solid #00cc66;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
        }
        
        .status-container {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
        
        /* تحسين التجاوب */
        @media (max-width: 600px) {
            .key-item { flex-direction: column; }
            .key-value { max-width: 100%; }
            .header h1 { font-size: 1.5em; }
        }
        
        /* spinning animation */
        .spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🛡️ اختبار Supabase</h1>
            <p>تأكد من اتصال قاعدة البيانات بشكل صحيح</p>
            <div style="margin-top: 15px;">
                <button class="btn btn-primary" onclick="runTest()">
                    🔄 إعادة الاختبار
                </button>
                <button class="btn btn-secondary" onclick="toggleKeys()">
                    👁️ إظهار/إخفاء المفاتيح
                </button>
            </div>
        </div>

        <!-- حالة الاتصال -->
        <div class="card">
            <h3>📊 حالة الاتصال</h3>
            <div id="connection-status">
                <span class="badge badge-info">⏳ جاري التهيئة...</span>
            </div>
            <div id="connection-details" style="margin-top: 12px;"></div>
        </div>

        <!-- المنتجات -->
        <div class="card">
            <h3>📋 المنتجات</h3>
            <div id="products-data"></div>
            <div id="products-list" style="margin-top: 10px;"></div>
        </div>

        <!-- المفاتيح -->
        <div class="card">
            <h3>🔑 المفاتيح</h3>
            <div id="keys-info"></div>
        </div>

        <!-- Footer -->
        <div class="footer">
            🔐 نظام آمن لإدارة المفاتيح | Tithkari Store
        </div>
    </div>

    <!-- تحميل Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    
    <script>
        // ================================================================
        // 🔐 إعدادات Supabase - ضع مفاتيحك هنا
        // ================================================================
        const CONFIG = {
            supabaseUrl: 'https://savtqajghyloevzwrzvt.supabase.co',
            supabaseAnonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhdnRxYWpnaHlsb2V2endyenZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3ODA1OTMsImV4cCI6MjA5ODM1NjU5M30.CBq7eKyr3RR11op_SevMBBcKQNKF7uftpaa-URemEww'
        };

        // ================================================================
        // المتغيرات العامة
        // ================================================================
        let supabaseClient = null;
        let showKeys = false;

        // ================================================================
        // عرض المفاتيح
        // ================================================================
        function displayKeys() {
            const keysInfo = document.getElementById('keys-info');
            const keys = [
                { name: '🔗 URL', value: CONFIG.supabaseUrl, sensitive: false },
                { name: '🔑 Anon Key', value: CONFIG.supabaseAnonKey, sensitive: true }
            ];

            let html = '';
            keys.forEach(key => {
                let displayValue = key.value;
                if (key.sensitive && !showKeys) {
                    displayValue = '••••••••••••••••••••••••••••••••';
                } else if (key.value && key.value.length > 40) {
                    displayValue = key.value.substring(0, 25) + '...' + key.value.substring(key.value.length - 10);
                }
                html += `
                    <div class="key-item">
                        <span class="key-name">${key.name}</span>
                        <span class="key-value ${key.sensitive && !showKeys ? 'hidden' : ''}">
                            ${displayValue || '❌ غير محدد'}
                        </span>
                    </div>
                `;
            });
            keysInfo.innerHTML = html;
        }

        // ================================================================
        // تبديل إظهار المفاتيح
        // ================================================================
        window.toggleKeys = function() {
            showKeys = !showKeys;
            displayKeys();
        };

        // ================================================================
        // اختبار Supabase
        // ================================================================
        async function testSupabase() {
            const statusEl = document.getElementById('connection-status');
            const detailsEl = document.getElementById('connection-details');
            const productsList = document.getElementById('products-list');
            const productsData = document.getElementById('products-data');

            try {
                // 1. التحقق من وجود Supabase
                if (typeof window.supabase === 'undefined') {
                    throw new Error('مكتبة Supabase لم يتم تحميلها. تأكد من الاتصال بالإنترنت.');
                }

                // 2. تهيئة العميل
                statusEl.innerHTML = '<span class="badge badge-info"><span class="spinner">⏳</span> جاري الاتصال...</span>';
                detailsEl.innerHTML = '';
                productsData.innerHTML = '<span class="badge badge-info">⏳ جاري التحميل...</span>';

                supabaseClient = window.supabase.createClient(
                    CONFIG.supabaseUrl,
                    CONFIG.supabaseAnonKey
                );

                // 3. اختبار الاتصال - محاولة جلب البيانات
                const { data: products, error, count } = await supabaseClient
                    .from('products')
                    .select('*', { count: 'exact' })
                    .limit(10);

                // 4. معالجة النتيجة
                if (error) {
                    // إذا كان الخطأ بسبب عدم وجود الجدول
                    if (error.message && error.message.includes('relation')) {
                        statusEl.innerHTML = '<span class="badge badge-warning">⚠️ متصل ولكن لا يوجد جدول products</span>';
                        detailsEl.innerHTML = `
                            <div class="success-box">
                                <h4 style="color: #66ff88;">✅ الاتصال ناجح</h4>
                                <p style="color: #8899aa;">تم الاتصال بـ Supabase ولكن جدول <code>products</code> غير موجود.</p>
                                <p style="color: #8899aa; margin-top: 8px;">
                                    💡 قم بإنشاء الجدول أو تحقق من اسم الجدول.
                                </p>
                            </div>
                        `;
                        productsList.innerHTML = `
                            <div style="color: #8899aa; text-align: center; padding: 20px;">
                                📭 لا يوجد جدول products
                                <div style="font-size: 0.8em; margin-top: 8px;">
                                    خطأ: ${error.message}
                                </div>
                            </div>
                        `;
                        productsData.innerHTML = '<span class="badge badge-warning">⚠️ جدول غير موجود</span>';
                        return;
                    }
                    throw error;
                }

                // 5. نجاح الاتصال
                statusEl.innerHTML = '<span class="badge badge-success">✅ متصل بنجاح</span>';
                detailsEl.innerHTML = `
                    <div class="success-box">
                        <h4 style="color: #66ff88;">✅ تم الاتصال بـ Supabase</h4>
                        <p style="color: #8899aa;">عدد المنتجات: <strong style="color: #ffd700;">${products?.length || 0}</strong></p>
                        <p style="color: #667788; font-size: 0.8em; margin-top: 5px;">
                            🆔 قاعدة البيانات: ${CONFIG.supabaseUrl}
                        </p>
                    </div>
                `;

                productsData.innerHTML = `<span class="badge badge-success">✅ تم تحميل ${products?.length || 0} منتج</span>`;

                // 6. عرض المنتجات
                if (products && products.length > 0) {
                    let html = '';
                    products.forEach((p, i) => {
                        html += `
                            <div class="product-item">
                                <div class="product-name">${i + 1}. ${p.name || 'بدون اسم'}</div>
                                <div class="product-price">💰 ${p.price || 0} ريال</div>
                                <div class="product-category">📂 ${p.category || 'غير مصنف'}</div>
                                <div class="product-id">🆔 ${p.id || 'لا يوجد'}</div>
                            </div>
                        `;
                    });
                    productsList.innerHTML = html;
                } else {
                    productsList.innerHTML = `
                        <div style="color: #8899aa; text-align: center; padding: 20px;">
                            📭 لا توجد منتجات
                            <div style="font-size: 0.8em; margin-top: 8px; color: #667788;">
                                أضف منتجات من لوحة التحكم
                            </div>
                        </div>
                    `;
                }

            } catch (error) {
                // 7. فشل الاتصال
                console.error('❌ Supabase Error:', error);
                
                statusEl.innerHTML = '<span class="badge badge-error">❌ فشل الاتصال</span>';
                detailsEl.innerHTML = `
                    <div class="error-box">
                        <h4>❌ ${error.message || 'حدث خطأ غير متوقع'}</h4>
                        <ul>
                            <li>تأكد من أن المفاتيح صحيحة</li>
                            <li>تأكد من الاتصال بالإنترنت</li>
                            <li>تأكد من تشغيل الخادم المحلي</li>
                        </ul>
                        <div style="margin-top: 10px; background: #0a0e17; padding: 10px; border-radius: 6px;">
                            <code style="color: #ffd700; font-size: 0.9em;">
                                python -m http.server 8000
                            </code>
                            <br>
                            <span style="color: #667788; font-size: 0.8em;">
                                ثم افتح: http://localhost:8000/test-supabase.html
                            </span>
                        </div>
                    </div>
                `;
                productsData.innerHTML = '<span class="badge badge-error">❌ فشل التحميل</span>';
                productsList.innerHTML = `
                    <div style="color: #ff4444; text-align: center; padding: 20px;">
                        ❌ لا يمكن تحميل المنتجات
                    </div>
                `;
            }
        }

        // ================================================================
        // تشغيل الاختبار
        // ================================================================
        window.runTest = function() {
            displayKeys();
            testSupabase();
        };

        // ================================================================
        // التهيئة عند تحميل الصفحة
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            // عرض المفاتيح
            displayKeys();
            
            // تحقق من وجود Supabase
            if (typeof window.supabase !== 'undefined') {
                console.log('✅ Supabase library loaded');
                testSupabase();
            } else {
                // انتظر تحميل المكتبة
                const statusEl = document.getElementById('connection-status');
                statusEl.innerHTML = '<span class="badge badge-warning">⏳ جاري تحميل Supabase...</span>';
                
                const checkSupabase = setInterval(function() {
                    if (typeof window.supabase !== 'undefined') {
                        clearInterval(checkSupabase);
                        console.log('✅ Supabase library loaded');
                        testSupabase();
                    }
                }, 500);
                
                // timeout بعد 10 ثواني
                setTimeout(function() {
                    clearInterval(checkSupabase);
                    if (typeof window.supabase === 'undefined') {
                        statusEl.innerHTML = '<span class="badge badge-error">❌ فشل تحميل Supabase</span>';
                        document.getElementById('connection-details').innerHTML = `
                            <div class="error-box">
                                <h4>❌ لم يتم تحميل مكتبة Supabase</h4>
                                <ul>
                                    <li>تأكد من الاتصال بالإنترنت</li>
                                    <li>حاول تحديث الصفحة</li>
                                    <li>تحقق من وجود <code>https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2</code></li>
                                </ul>
                            </div>
                        `;
                    }
                }, 10000);
            }
        });

        // ================================================================
        // معالجة الأخطاء العامة
        // ================================================================
        window.addEventListener('error', function(e) {
            console.error('❌ Global error:', e);
            const statusEl = document.getElementById('connection-status');
            if (statusEl) {
                statusEl.innerHTML = '<span class="badge badge-error">❌ خطأ في الصفحة</span>';
            }
        });

        console.log('🛡️ Tithkari - Supabase Test Page');
        console.log('📋 Config:', CONFIG);
    </script>
</body>
</html>
