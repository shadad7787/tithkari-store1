<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🎨 صمم درعك - Tithkari</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    
    <style>
        /* ===== تنسيقات الاستوديو المتقدمة ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
        }

        :root {
            --studio-bg: #0a0a12;
            --studio-panel: #12121e;
            --studio-border: #1e1e2e;
            --studio-gold: #d4af37;
            --studio-text: #f3f4f6;
            --studio-muted: #9ca3af;
        }

        body {
            background: var(--studio-bg);
            color: var(--studio-text);
            overflow: hidden;
            height: 100vh;
            font-family: 'Cairo', 'Tajawal', sans-serif;
        }

        /* ===== الهيدر ===== */
        .studio-header {
            background: var(--studio-panel);
            border-bottom: 1px solid var(--studio-border);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 50px;
            z-index: 100;
            flex-shrink: 0;
        }

        .studio-header .logo {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 15px;
            font-weight: 800;
            color: var(--studio-gold);
            text-decoration: none;
        }

        .studio-header .logo i {
            font-size: 18px;
        }

        .studio-header .actions {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* ===== الحاوية الرئيسية ===== */
        .studio-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 50px);
        }

        /* ===== منطقة المعاينة (في الأعلى) ===== */
        .studio-preview-area {
            flex: 0 0 45%;
            min-height: 200px;
            max-height: 50%;
            background: var(--studio-bg);
            padding: 6px;
            display: flex;
            flex-direction: column;
            border-bottom: 2px solid var(--studio-border);
            overflow: hidden;
        }

        /* ===== شريط الأدوات أعلى المعاينة ===== */
        .preview-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 10px;
            background: var(--studio-panel);
            border-radius: 6px;
            margin-bottom: 4px;
            border: 1px solid var(--studio-border);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 4px;
        }

        .preview-toolbar .title {
            color: var(--studio-gold);
            font-size: 11px;
            font-weight: 700;
        }

        .preview-toolbar .product-name {
            color: var(--studio-muted);
            font-size: 10px;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .preview-toolbar .history-buttons {
            display: flex;
            gap: 4px;
        }

        .preview-toolbar .history-buttons button {
            padding: 2px 8px;
            font-size: 10px;
            background: #1e1e2e;
            color: var(--studio-text);
            border: 1px solid var(--studio-border);
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }

        .preview-toolbar .history-buttons button:hover {
            border-color: var(--studio-gold);
            background: #2a2a3e;
        }

        .preview-toolbar .layer-info {
            color: var(--studio-muted);
            font-size: 10px;
        }

        /* ===== المعاينة المزدوجة ===== */
        .preview-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            min-height: 0;
        }

        .preview-panel {
            background: #0d0d17;
            border-radius: 6px;
            border: 1px solid var(--studio-border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .preview-panel .panel-label {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(0,0,0,0.75);
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 8px;
            color: var(--studio-muted);
            z-index: 10;
            backdrop-filter: blur(4px);
        }

        .preview-panel .panel-label.reference {
            border: 1px solid #3b82f6;
            color: #3b82f6;
        }

        .preview-panel .panel-label.template {
            border: 1px solid var(--studio-gold);
            color: var(--studio-gold);
        }

        .preview-panel .panel-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            min-height: 0;
            cursor: default;
        }

        .preview-panel .panel-content img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
        }

        /* ===== القماش التفاعلي ===== */
        .canvas-frame {
            position: relative;
            width: 100%;
            max-width: 300px;
            aspect-ratio: 4/5;
            background: #0d0d17;
            border-radius: 6px;
            border: 1px solid var(--studio-border);
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin: 0 auto;
            touch-action: none;
        }

        .canvas-frame .base-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .canvas-frame .base-layer img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .canvas-frame .layers-surface {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .canvas-frame .layers-surface .layer {
            position: absolute;
            pointer-events: auto;
            cursor: grab;
            border: 1px solid transparent;
            padding: 2px;
            touch-action: none;
        }

        .canvas-frame .layers-surface .layer.focused {
            border: 1px dashed var(--studio-gold);
            outline: 2px dashed rgba(212,175,55,0.25);
            outline-offset: 2px;
        }

        .canvas-frame .layers-surface .layer .text-content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4px;
            font-weight: 700;
            white-space: pre-wrap;
            word-break: break-word;
            border-radius: 4px;
            cursor: text;
            min-height: 20px;
            min-width: 20px;
            font-size: 14px;
        }

        .canvas-frame .layers-surface .layer .text-content.editing {
            background: rgba(0,0,0,0.8) !important;
            outline: 2px solid var(--studio-gold);
            z-index: 100;
        }

        .canvas-frame .layers-surface .layer .image-placeholder {
            width: 100%;
            height: 100%;
            border: 2px dashed rgba(212,175,55,0.2);
            background: rgba(212,175,55,0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 10px;
            color: var(--studio-muted);
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
            overflow: hidden;
        }

        .canvas-frame .layers-surface .layer .image-placeholder:hover {
            border-color: var(--studio-gold);
            background: rgba(212,175,55,0.06);
        }

        .canvas-frame .layers-surface .layer .image-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .canvas-frame .layers-surface .layer .resize-handle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--studio-gold);
            border: 2px solid #fff;
            border-radius: 50%;
            z-index: 20;
            display: none;
            touch-action: none;
        }

        .canvas-frame .layers-surface .layer.focused .resize-handle { display: block; }
        .resize-se { right: -4px; bottom: -4px; cursor: se-resize; }
        .resize-e { right: -4px; top: 50%; transform: translateY(-50%); cursor: ew-resize; }
        .resize-s { bottom: -4px; left: 50%; transform: translateX(-50%); cursor: ns-resize; }

        /* ===== اللوحة السفلية (الأدوات) ===== */
        .studio-bottom {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--studio-panel);
            overflow: hidden;
            min-height: 0;
        }

        .studio-bottom .tabs-nav {
            display: flex;
            gap: 2px;
            padding: 4px 8px;
            background: var(--studio-bg);
            border-bottom: 1px solid var(--studio-border);
            flex-shrink: 0;
            overflow-x: auto;
        }

        .studio-bottom .tabs-nav button {
            padding: 6px 12px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--studio-muted);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .studio-bottom .tabs-nav button.active {
            color: var(--studio-gold);
            border-bottom-color: var(--studio-gold);
        }

        .studio-bottom .tabs-nav button:hover {
            color: var(--studio-text);
        }

        .studio-bottom .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 6px 8px;
        }

        .studio-bottom .tab-content .tab-panel {
            display: none;
        }

        .studio-bottom .tab-content .tab-panel.active {
            display: block;
        }

        /* ===== تنسيقات داخل التبويبات ===== */
        .section-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--studio-border);
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 6px;
        }

        .section-card h3 {
            font-size: 11px;
            color: var(--studio-gold);
            margin-bottom: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            padding-bottom: 3px;
        }

        .section-card label {
            display: block;
            font-size: 10px;
            color: var(--studio-muted);
            margin-bottom: 2px;
            margin-top: 4px;
        }

        .section-card input[type="text"],
        .section-card textarea,
        .section-card select {
            width: 100%;
            background: #0a0a12;
            border: 1px solid var(--studio-border);
            border-radius: 4px;
            padding: 5px 8px;
            color: #fff;
            font-size: 11px;
            outline: none;
            font-family: inherit;
        }

        .section-card input[type="text"]:focus,
        .section-card textarea:focus,
        .section-card select:focus {
            border-color: var(--studio-gold);
        }

        .section-card textarea { resize: vertical; min-height: 30px; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }

        .range-row { display: flex; align-items: center; gap: 4px; margin-top: 2px; font-size: 10px; }
        .range-row input[type="range"] { flex: 1; accent-color: var(--studio-gold); height: 3px; }
        .range-row input[type="color"] { width: 24px; height: 24px; border: 1px solid var(--studio-border); border-radius: 4px; cursor: pointer; background: transparent; padding: 2px; }

        /* ===== الأزرار ===== */
        .btn-gold {
            background: linear-gradient(135deg, var(--studio-gold), #b8952e);
            color: #000;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            justify-content: center;
        }

        .btn-gold:hover { opacity: 0.85; transform: translateY(-1px); }

        .btn-dark {
            background: #1e1e2e;
            color: var(--studio-text);
            border: 1px solid var(--studio-border);
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            justify-content: center;
        }

        .btn-dark:hover { border-color: var(--studio-gold); background: #2a2a3e; }

        .btn-purple {
            background: linear-gradient(135deg, #8B5CF6, #6D28D9);
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            justify-content: center;
        }

        .btn-purple:hover { opacity: 0.85; transform: translateY(-1px); }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid #ef4444;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }

        .btn-danger:hover { background: rgba(239, 68, 68, 0.25); }

        .btn-block { width: 100%; }
        .btn-sm { padding: 3px 6px; font-size: 9px; }

        /* ===== معرض القوالب ===== */
        .templates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 4px;
        }

        .template-thumb {
            background: #0a0a12;
            border: 1px solid var(--studio-border);
            border-radius: 4px;
            padding: 3px;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
            font-size: 8px;
            color: var(--studio-muted);
        }

        .template-thumb:hover { border-color: var(--studio-gold); transform: scale(1.02); }
        .template-thumb img { width: 100%; height: 35px; object-fit: contain; border-radius: 3px; margin-bottom: 2px; }
        .template-thumb.active { border-color: var(--studio-gold); background: rgba(212,175,55,0.08); }

        /* ===== إشعار ===== */
        .toast-notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--studio-panel);
            border: 1px solid var(--studio-gold);
            border-radius: 8px;
            padding: 8px 16px;
            color: #fff;
            font-size: 12px;
            z-index: 9999;
            animation: slideUp 0.4s ease;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .toast-notification.success { border-color: #16a34a; }
        .toast-notification.error { border-color: #ef4444; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(30px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== ريسپونسيف للجوال ===== */
        @media (max-width: 768px) {
            .studio-header { padding: 4px 8px; height: 44px; }
            .studio-header .logo { font-size: 13px; }
            .studio-header .actions .btn-sm { font-size: 9px; padding: 2px 6px; }
            
            .studio-preview-area { flex: 0 0 42%; max-height: 45%; }
            .preview-toolbar { padding: 2px 6px; }
            .preview-toolbar .title { font-size: 10px; }
            .preview-toolbar .product-name { font-size: 9px; max-width: 70px; }
            
            .canvas-frame { max-width: 200px; }
            .canvas-frame .layers-surface .layer .text-content { font-size: 12px; }
            
            .studio-bottom .tabs-nav button { font-size: 10px; padding: 4px 8px; }
            .studio-bottom .tab-content { padding: 4px 6px; }
            
            .section-card { padding: 6px 8px; }
            .section-card h3 { font-size: 10px; }
            
            .templates-grid { grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); }
            .template-thumb img { height: 30px; }
            
            .grid-2 { grid-template-columns: 1fr; }
            .grid-3 { grid-template-columns: 1fr 1fr; }
            
            .btn-gold, .btn-dark, .btn-purple { font-size: 10px; padding: 4px 8px; }
        }

        @media (max-width: 480px) {
            .studio-preview-area { flex: 0 0 38%; max-height: 40%; }
            .canvas-frame { max-width: 150px; }
            .preview-container { grid-template-columns: 1fr 1fr; gap: 2px; }
            .preview-panel .panel-label { font-size: 7px; top: 2px; right: 2px; padding: 1px 4px; }
            
            .studio-bottom .tabs-nav { padding: 2px 4px; gap: 1px; }
            .studio-bottom .tabs-nav button { font-size: 9px; padding: 3px 6px; }
        }
    </style>
</head>
<body>

    <!-- ===== الهيدر ===== -->
    <header class="studio-header">
        <a href="index.html" class="logo">
            <i class="fas fa-shield-halved"></i>
            <span>Tithkari</span>
            <span style="font-size: 10px; color: #9ca3af; font-weight: 400;">| صمم درعك</span>
        </a>
        <div class="actions">
            <button class="btn-dark btn-sm" onclick="window.location.href='index.html'">
                <i class="fas fa-arrow-right"></i>
            </button>
            <button class="btn-gold btn-sm" onclick="addDesignToCart()">
                <i class="fas fa-cart-plus"></i>
            </button>
            <button class="btn-purple btn-sm" onclick="exportDesign()">
                <i class="fas fa-download"></i>
            </button>
        </div>
    </header>

    <!-- ===== الحاوية الرئيسية ===== -->
    <div class="studio-container">

        <!-- ===== منطقة المعاينة (في الأعلى) ===== -->
        <div class="studio-preview-area">

            <!-- ===== شريط الأدوات أعلى المعاينة ===== -->
            <div class="preview-toolbar">
                <span class="title">🎨 معاينة</span>
                <span class="product-name" id="productNameDisplay">درع مخصص</span>
                <div class="history-buttons">
                    <button onclick="undoAction()" title="تراجع"><i class="fas fa-undo"></i></button>
                    <button onclick="redoAction()" title="تقدم"><i class="fas fa-redo"></i></button>
                </div>
                <span class="layer-info" id="layerCount">0</span>
            </div>

            <!-- ===== المعاينة المزدوجة ===== -->
            <div class="preview-container">
                <!-- الصورة المرجعية -->
                <div class="preview-panel">
                    <span class="panel-label reference">📸 مرجع</span>
                    <div class="panel-content">
                        <img id="referenceImage" src="https://i.ibb.co/RTRLKHyx/photo-5852448705733136453-y.jpg" alt="الصورة المرجعية">
                    </div>
                </div>

                <!-- قالب التصميم -->
                <div class="preview-panel">
                    <span class="panel-label template">🛡️ القالب</span>
                    <div class="panel-content">
                        <div class="canvas-frame" id="canvasFrame" onclick="deselectLayer(event)">
                            <div class="base-layer" id="baseLayer">
                                <img id="baseImage" src="https://i.ibb.co/vxn3p7C7/Gemini-Generated-Image-g2xtelg2xtelg2xt.png" alt="درع">
                            </div>
                            <div class="layers-surface" id="layersSurface"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- ===== اللوحة السفلية (الأدوات) ===== -->
        <div class="studio-bottom">

            <!-- ===== تبويبات الأدوات ===== -->
            <div class="tabs-nav" id="tabsNav">
                <button class="active" data-tab="templates">🛡️ قوالب</button>
                <button data-tab="layers">➕ طبقات</button>
                <button data-tab="text">✍️ نص</button>
                <button data-tab="transform">🎯 تحويل</button>
                <button data-tab="actions">⚡ إجراءات</button>
            </div>

            <!-- ===== محتوى التبويبات ===== -->
            <div class="tab-content">

                <!-- تبويب القوالب -->
                <div class="tab-panel active" id="tab-templates">
                    <div class="section-card">
                        <h3>🛡️ قالب الدرع</h3>
                        <div class="templates-grid" id="templatesGrid"></div>
                    </div>
                    <div class="section-card">
                        <h3>🔗 ربط القالب بمنتج</h3>
                        <select id="productLinkSelect" style="width:100%;padding:5px 8px;border-radius:4px;background:#0a0a12;color:#fff;border:1px solid var(--studio-border);font-family:inherit;font-size:11px;">
                            <option value="">-- غير مرتبط بمنتج --</option>
                        </select>
                        <small style="color:#9ca3af;font-size:9px;">عند حفظ القالب، سيتم ربطه بالمنتج المحدد</small>
                    </div>
                </div>

                <!-- تبويب الطبقات -->
                <div class="tab-panel" id="tab-layers">
                    <div class="section-card">
                        <h3>➕ إضافة عناصر</h3>
                        <div class="grid-2">
                            <button class="btn-dark btn-sm" onclick="addTextLayer()"><i class="fas fa-font"></i> نص</button>
                            <button class="btn-dark btn-sm" onclick="triggerImageUpload()"><i class="fas fa-image"></i> صورة</button>
                        </div>
                        <input type="file" id="imageUploader" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
                    </div>
                    <div class="section-card">
                        <h3>📋 الطبقات الحالية</h3>
                        <div id="layersList" style="max-height:100px;overflow-y:auto;font-size:10px;color:var(--studio-muted);">
                            <p style="color:var(--studio-muted);font-size:10px;">لا توجد طبقات</p>
                        </div>
                    </div>
                </div>

                <!-- تبويب النص -->
                <div class="tab-panel" id="tab-text">
                    <div class="section-card" id="textControls">
                        <h3>✍️ تنسيق النص</h3>
                        <label>النص</label>
                        <textarea id="textContent" rows="2" oninput="updateActiveText()" placeholder="اكتب النص..."></textarea>
                        <label>الخط</label>
                        <select id="fontFamily" onchange="updateActiveText()">
                            <option value="Cairo">كايرو</option>
                            <option value="Tajawal">تجول</option>
                            <option value="Amiri">أميري</option>
                            <option value="Reem Kufi">ريم كوفي</option>
                            <option value="Changa">شانغا</option>
                            <option value="Almarai">المراعي</option>
                            <option value="El Messiri">المسيري</option>
                            <option value="Lemonada">ليمونادة</option>
                        </select>
                        <div class="range-row">
                            <span>الحجم</span>
                            <input type="range" id="fontSize" min="10" max="60" value="18" oninput="updateActiveText()">
                            <span id="fontSizeDisplay">18</span>
                        </div>
                        <div class="range-row">
                            <span>اللون</span>
                            <input type="color" id="textColor" value="#d4af37" onchange="updateActiveText()">
                        </div>
                        <div class="range-row">
                            <span>خلفية</span>
                            <input type="color" id="textBgColor" value="#000000" onchange="updateActiveText()">
                            <label style="margin:0; font-size:9px;">
                                <input type="checkbox" id="textBgToggle" checked onchange="updateActiveText()"> تفعيل
                            </label>
                        </div>
                    </div>
                </div>

                <!-- تبويب التحويل -->
                <div class="tab-panel" id="tab-transform">
                    <div class="section-card">
                        <h3>🎯 تحويل 3D</h3>
                        <div class="range-row"><span>X</span><input type="range" id="tiltX" min="-45" max="45" value="0" oninput="updateTransform()"></div>
                        <div class="range-row"><span>Y</span><input type="range" id="tiltY" min="-45" max="45" value="0" oninput="updateTransform()"></div>
                        <div class="range-row"><span>Z</span><input type="range" id="rotateZ" min="-180" max="180" value="0" oninput="updateTransform()"></div>
                        <button class="btn-dark btn-sm btn-block" onclick="resetTransform()">تصفير</button>
                    </div>
                    <div class="section-card">
                        <h3>📜 عبارات جاهزة</h3>
                        <select id="presetQuotes" onchange="applyPresetQuote(this.value)" style="width:100%;padding:5px 8px;border-radius:4px;background:#0a0a12;color:#fff;border:1px solid var(--studio-border);font-family:inherit;font-size:11px;">
                            <option value="">-- اختر عبارة --</option>
                        </select>
                    </div>
                </div>

                <!-- تبويب الإجراءات -->
                <div class="tab-panel" id="tab-actions">
                    <div class="section-card">
                        <h3>⚡ إجراءات</h3>
                        <button class="btn-gold btn-block" style="margin-top:4px; background: #8B5CF6;" onclick="saveCurrentTemplate()">
                            <i class="fas fa-save"></i> حفظ وتصدير القالب
                        </button>
                        <button class="btn-danger btn-sm btn-block" style="margin-top:4px;" onclick="deleteActiveLayer()">
                            <i class="fas fa-trash"></i> حذف الطبقة المحددة
                        </button>
                        <button class="btn-dark btn-sm btn-block" style="margin-top:4px;" onclick="clearAllLayers()">
                            <i class="fas fa-eraser"></i> مسح جميع الطبقات
                        </button>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <script type="module" src="design-studio.js"></script>
    
    <script>
        // ===== تبديل التبويبات =====
        document.addEventListener('DOMContentLoaded', function() {
            const tabsNav = document.getElementById('tabsNav');
            const tabPanels = document.querySelectorAll('.tab-panel');
            
            tabsNav.addEventListener('click', function(e) {
                const btn = e.target.closest('button');
                if (!btn) return;
                
                // إزالة التفعيل من جميع الأزرار
                tabsNav.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                // إخفاء جميع اللوحات
                tabPanels.forEach(p => p.classList.remove('active'));
                
                // إظهار اللوحة المطلوبة
                const tabId = btn.dataset.tab;
                const targetPanel = document.getElementById('tab-' + tabId);
                if (targetPanel) {
                    targetPanel.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
