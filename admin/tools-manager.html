<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إدارة الأدوات - Tithkari Admin</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: #0F0F1A;
            color: #FFFFFF;
            direction: rtl;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* الهيدر */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 2px solid #FFD700;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 {
            color: #FFD700;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-primary {
            padding: 10px 24px;
            background: linear-gradient(135deg, #FFD700, #FFED4A);
            color: #0F0F1A;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.3);
        }
        .btn-secondary {
            padding: 10px 24px;
            background: rgba(255,255,255,0.05);
            color: #FFFFFF;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
        }
        .btn-danger {
            padding: 8px 16px;
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s ease;
        }
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.3);
        }
        .btn-success {
            padding: 8px 16px;
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s ease;
        }
        .btn-success:hover {
            background: rgba(16, 185, 129, 0.3);
        }
        .btn-purple {
            padding: 8px 16px;
            background: rgba(139, 92, 246, 0.2);
            color: #8B5CF6;
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s ease;
        }
        .btn-purple:hover {
            background: rgba(139, 92, 246, 0.3);
        }
        
        /* شبكة الأدوات */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        
        .tool-card {
            background: #1A1A2E;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 215, 0, 0.05);
            transition: all 0.3s ease;
            position: relative;
        }
        .tool-card:hover {
            border-color: rgba(255, 215, 0, 0.15);
            transform: translateY(-3px);
        }
        .tool-card .tool-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .tool-card .tool-icon {
            font-size: 32px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: rgba(255, 215, 0, 0.05);
        }
        .tool-card .tool-status {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 600;
        }
        .tool-card .tool-status.active {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .tool-card .tool-status.inactive {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .tool-card .tool-status.draft {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.2);
        }
        .tool-card .tool-name {
            font-size: 18px;
            font-weight: 700;
            color: #FFFFFF;
            margin-bottom: 4px;
        }
        .tool-card .tool-desc {
            font-size: 13px;
            color: #8A8A9B;
            margin-bottom: 12px;
        }
        .tool-card .tool-fields {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .tool-card .tool-fields .field-group {
            margin-bottom: 10px;
        }
        .tool-card .tool-fields .field-group label {
            display: block;
            font-size: 12px;
            color: #8A8A9B;
            font-weight: 600;
            margin-bottom: 3px;
        }
        .tool-card .tool-fields .field-group input,
        .tool-card .tool-fields .field-group textarea {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            background: #0F0F1A;
            color: #FFFFFF;
            border: 1px solid rgba(255, 215, 0, 0.08);
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
        }
        .tool-card .tool-fields .field-group input:focus,
        .tool-card .tool-fields .field-group textarea:focus {
            border-color: #FFD700;
            outline: none;
        }
        .tool-card .tool-fields .field-group textarea {
            resize: vertical;
            min-height: 60px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
        }
        .tool-card .tool-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
        }
        
        /* النافذة المنبثقة */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: #1A1A2E;
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            animation: modalFade 0.3s ease;
        }
        @keyframes modalFade {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-close {
            float: left;
            background: rgba(255,255,255,0.05);
            border: none;
            color: #FFFFFF;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
        }
        .modal-close:hover {
            background: rgba(239, 68, 68, 0.3);
        }
        .modal-content h2 {
            color: #FFD700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-content .form-group {
            margin-bottom: 15px;
        }
        .modal-content .form-group label {
            display: block;
            color: #8A8A9B;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .modal-content .form-group input,
        .modal-content .form-group select,
        .modal-content .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            background: #0F0F1A;
            color: #FFFFFF;
            border: 1px solid rgba(255, 215, 0, 0.08);
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
        }
        .modal-content .form-group input:focus,
        .modal-content .form-group select:focus,
        .modal-content .form-group textarea:focus {
            border-color: #FFD700;
            outline: none;
        }
        .modal-content .form-group textarea {
            resize: vertical;
            min-height: 80px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        .modal-content .form-group .help-text {
            font-size: 11px;
            color: #8A8A9B;
            margin-top: 3px;
        }
        .modal-content .form-group .help-text a {
            color: #FFD700;
        }
        .modal-content .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }
        
        /* Toast */
        #toastContainer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 350px;
            width: 100%;
            direction: rtl;
        }
        .toast-item {
            background: #1A1A2E;
            color: #fff;
            padding: 12px 16px;
            border-radius: 12px;
            border-right: 4px solid #2196F3;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            font-size: 14px;
            animation: slideInRight 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: Cairo, sans-serif;
        }
        .toast-item.success { border-right-color: #4CAF50; }
        .toast-item.error { border-right-color: #f44336; }
        .toast-item.warning { border-right-color: #FF9800; }
        .toast-item.info { border-right-color: #2196F3; }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
        
        /* بحث */
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .search-container input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 8px;
            background: #1A1A2E;
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-family: 'Cairo', sans-serif;
            min-width: 200px;
        }
        .search-container input:focus {
            border-color: #FFD700;
            outline: none;
        }
        .search-container input::placeholder {
            color: #8A8A9B;
        }
        
        /* إحصائيات */
        .stats {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .stat-item {
            background: #1A1A2E;
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 215, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .stat-item .count {
            font-weight: 700;
            color: #FFD700;
            font-size: 18px;
        }
        
        @media (max-width: 768px) {
            .tools-grid {
                grid-template-columns: 1fr;
            }
            .modal-content .form-row {
                grid-template-columns: 1fr;
            }
            .form-row-3 {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                text-align: center;
            }
            .header-actions {
                justify-content: center;
            }
            .stats {
                justify-content: center;
            }
            .search-container input {
                min-width: 150px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- الهيدر -->
    <div class="header">
        <h1><i class="fas fa-plug"></i> إدارة الأدوات والتطبيقات</h1>
        <div class="header-actions">
            <button class="btn-primary" onclick="openAddToolModal()">
                <i class="fas fa-plus"></i> إضافة أداة جديدة
            </button>
            <button class="btn-secondary" onclick="injectAllTools()">
                <i class="fas fa-sync"></i> حقن جميع الأدوات
            </button>
            <button class="btn-secondary" onclick="exportTools()">
                <i class="fas fa-file-export"></i> تصدير
            </button>
            <button class="btn-secondary" onclick="document.getElementById('importFile').click()">
                <i class="fas fa-file-import"></i> استيراد
            </button>
            <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importTools(this.files[0])" />
            <button class="btn-secondary" onclick="loadTools()">
                <i class="fas fa-redo"></i> تحديث
            </button>
        </div>
    </div>

    <!-- الإحصائيات -->
    <div class="stats" id="statsContainer">
        <div class="stat-item">
            <span>📦</span>
            <span>إجمالي الأدوات:</span>
            <span class="count" id="totalTools">0</span>
        </div>
        <div class="stat-item">
            <span>✅</span>
            <span>نشطة:</span>
            <span class="count" id="activeTools">0</span>
        </div>
        <div class="stat-item">
            <span>❌</span>
            <span>غير نشطة:</span>
            <span class="count" id="inactiveTools">0</span>
        </div>
    </div>

    <!-- بحث -->
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="🔍 بحث عن أداة..." oninput="filterTools(this.value)" />
        <select id="categoryFilter" onchange="filterTools()" style="padding:10px 16px;border-radius:8px;background:#1A1A2E;color:#FFFFFF;border:1px solid rgba(255,255,255,0.05);font-family:'Cairo',sans-serif;">
            <option value="">📂 جميع التصنيفات</option>
            <option value="analytics">📊 تحليلات</option>
            <option value="marketing">📣 تسويق</option>
            <option value="social">🌐 تواصل اجتماعي</option>
            <option value="payment">💳 دفع</option>
            <option value="seo">🔍 تحسين محركات البحث</option>
            <option value="support">💬 دعم العملاء</option>
            <option value="other">📦 أخرى</option>
        </select>
    </div>

    <!-- شبكة الأدوات -->
    <div class="tools-grid" id="toolsGrid">
        <!-- سيتم تعبئتها بواسطة JavaScript -->
    </div>
</div>

<!-- ===== نافذة إضافة/تعديل أداة ===== -->
<div class="modal-overlay" id="toolModal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeToolModal()"><i class="fas fa-times"></i></button>
        <h2 id="toolModalTitle"><i class="fas fa-plus"></i> إضافة أداة جديدة</h2>
        <form id="toolForm" onsubmit="saveTool(event)">
            <input type="hidden" id="toolId" />
            
            <div class="form-group">
                <label>🏷️ اسم الأداة *</label>
                <input type="text" id="toolName" required placeholder="مثال: Google Analytics" />
            </div>
            
            <div class="form-group">
                <label>📝 وصف الأداة</label>
                <input type="text" id="toolDescription" placeholder="وصف مختصر للأداة" />
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>🎨 الأيقونة</label>
                    <select id="toolIcon">
                        <option value="fa-google">🔵 Google</option>
                        <option value="fa-facebook">🔵 Facebook</option>
                        <option value="fa-twitter">🐦 Twitter</option>
                        <option value="fa-instagram">📷 Instagram</option>
                        <option value="fa-linkedin">🔗 LinkedIn</option>
                        <option value="fa-youtube">▶️ YouTube</option>
                        <option value="fa-tiktok">🎵 TikTok</option>
                        <option value="fa-pinterest">📌 Pinterest</option>
                        <option value="fa-snapchat">👻 Snapchat</option>
                        <option value="fa-whatsapp">💬 WhatsApp</option>
                        <option value="fa-telegram">✈️ Telegram</option>
                        <option value="fa-discord">🎮 Discord</option>
                        <option value="fa-github">🐙 GitHub</option>
                        <option value="fa-stripe">💳 Stripe</option>
                        <option value="fa-paypal">🅿️ PayPal</option>
                        <option value="fa-amazon">🛒 Amazon</option>
                        <option value="fa-shopify">🛍️ Shopify</option>
                        <option value="fa-wordpress">📝 WordPress</option>
                        <option value="fa-tag">🏷️ Tag</option>
                        <option value="fa-code">💻 Code</option>
                        <option value="fa-chart-line">📊 Chart</option>
                        <option value="fa-cog">⚙️ Settings</option>
                        <option value="fa-fire">🔥 Fire</option>
                        <option value="fa-star">⭐ Star</option>
                        <option value="fa-heart">❤️ Heart</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>📂 تصنيف الأداة</label>
                    <select id="toolCategory">
                        <option value="analytics">📊 تحليلات</option>
                        <option value="marketing">📣 تسويق</option>
                        <option value="social">🌐 تواصل اجتماعي</option>
                        <option value="payment">💳 دفع</option>
                        <option value="seo">🔍 تحسين محركات البحث</option>
                        <option value="support">💬 دعم العملاء</option>
                        <option value="other">📦 أخرى</option>
                    </select>
                </div>
            </div>

            <div class="form-row-3">
                <div class="form-group">
                    <label>📌 الإصدار</label>
                    <input type="text" id="toolVersion" placeholder="1.0.0" value="1.0.0" />
                </div>
                <div class="form-group">
                    <label>🔢 ترتيب العرض</label>
                    <input type="number" id="toolOrder" value="0" min="0" />
                </div>
                <div class="form-group">
                    <label>🔘 حالة الأداة</label>
                    <select id="toolStatus">
                        <option value="active">✅ نشط</option>
                        <option value="inactive">❌ غير نشط</option>
                        <option value="draft">📝 مسودة</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label>📋 الكود المطلوب للحقن (HTML/JavaScript)</label>
                <textarea id="toolCode" rows="5" placeholder="&lt;!-- ضع الكود هنا --&gt;&#10;&lt;script&gt;&#10;  // كود JavaScript&#10;&lt;/script&gt;"></textarea>
                <div class="help-text">
                    💡 يمكنك استخدام المتغيرات: <code>{{TOOL_ID}}</code>, <code>{{TOOL_NAME}}</code>, <code>{{SITE_URL}}</code>
                </div>
            </div>

            <div class="form-group">
                <label>🎨 CSS إضافي (اختياري)</label>
                <textarea id="toolCss" rows="3" placeholder="/* ضع CSS هنا */"></textarea>
                <div class="help-text">سيتم حقن هذا CSS مع الأداة</div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>📌 موقع الحقن</label>
                    <select id="toolPosition">
                        <option value="head">في رأس الصفحة (Head)</option>
                        <option value="body_start">بداية الجسم (Body Start)</option>
                        <option value="body_end">نهاية الجسم (Body End)</option>
                        <option value="footer">في التذييل (Footer)</option>
                        <option value="custom">مخصص (يحدده المستخدم)</option>
                    </select>
                </div>
                <div class="form-group" id="customPositionGroup" style="display:none;">
                    <label>📍 الموقع المخصص (محدد CSS أو XPath)</label>
                    <input type="text" id="toolCustomPosition" placeholder="مثال: #analytics-container" />
                </div>
            </div>
            
            <div class="form-group">
                <label>
                    <input type="checkbox" id="toolInjectAutomatically" checked />
                    حقن تلقائي في جميع الصفحات
                </label>
            </div>
            
            <button type="submit" class="btn-primary" style="width:100%;justify-content:center;margin-top:10px;">
                <i class="fas fa-save"></i> حفظ الأداة
            </button>
        </form>
    </div>
</div>

<!-- ===== نافذة عرض الكود المحقون ===== -->
<div class="modal-overlay" id="injectedCodeModal">
    <div class="modal-content" style="max-width:800px;">
        <button class="modal-close" onclick="closeInjectedCodeModal()"><i class="fas fa-times"></i></button>
        <h2><i class="fas fa-code"></i> الكود المحقون</h2>
        <div id="injectedCodeContent" style="background:#0F0F1A;padding:15px;border-radius:8px;border:1px solid rgba(255,215,0,0.1);max-height:500px;overflow:auto;">
            <!-- سيتم تعبئتها -->
        </div>
        <button class="btn-primary" onclick="copyInjectedCode()" style="margin-top:15px;width:100%;justify-content:center;">
            <i class="fas fa-copy"></i> نسخ الكود
        </button>
    </div>
</div>

<!-- ===== Toast Container ===== -->
<div id="toastContainer"></div>

<script type="module" src="../js/tools-manager.js"></script>

</body>
</html>
