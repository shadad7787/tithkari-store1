<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المنتجات - Tithkari</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- Google Font - Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary: #8B0000;
            --primary-dark: #5C0000;
            --gold: #FFD700;
            --gold-light: #FFED4A;
            --dark: #0F0F1A;
            --dark-light: #1A1A2E;
            --gray: #8A8A9B;
            --white: #FFFFFF;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--dark);
            color: var(--white);
            direction: rtl;
            padding: 20px;
        }
        
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* ===== الهيدر ===== */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 2px solid var(--gold);
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .admin-header h1 {
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 28px;
        }
        
        .admin-header .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .admin-header a {
            color: var(--gray);
            text-decoration: none;
            transition: var(--transition);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,215,0,0.1);
        }
        
        .admin-header a:hover {
            color: var(--gold);
            border-color: var(--gold);
        }
        
        .admin-header .btn-add-product {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: var(--dark);
            border: none;
            font-weight: 700;
        }
        
        .admin-header .btn-add-product:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255,215,0,0.3);
            color: var(--dark);
        }
        
        /* ===== التبويبات ===== */
        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 30px;
            background: var(--dark-light);
            padding: 5px;
            border-radius: 12px;
            flex-wrap: wrap;
        }
        
        .tab-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--gray);
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .tab-btn:hover {
            color: var(--white);
            background: rgba(255,255,255,0.05);
        }
        
        .tab-btn.active {
            background: var(--gold);
            color: var(--dark);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* ===== قائمة المنتجات ===== */
        .products-grid-admin {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .product-card-admin {
            background: var(--dark-light);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid rgba(255,215,0,0.05);
            transition: var(--transition);
        }
        
        .product-card-admin:hover {
            border-color: rgba(255,215,0,0.2);
            transform: translateY(-3px);
        }
        
        .product-card-admin .product-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
        }
        
        .product-card-admin .product-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--gold);
        }
        
        .product-card-admin .product-price {
            color: var(--gold);
            font-weight: 700;
            font-size: 16px;
        }
        
        .product-card-admin .product-meta {
            color: var(--gray);
            font-size: 13px;
            margin: 8px 0;
        }
        
        .product-card-admin .product-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        
        .product-card-admin .product-actions button {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 13px;
            transition: var(--transition);
        }
        
        .btn-edit-product {
            background: rgba(255,215,0,0.1);
            color: var(--gold);
        }
        
        .btn-edit-product:hover {
            background: var(--gold);
            color: var(--dark);
        }
        
        .btn-fields {
            background: rgba(139,92,246,0.1);
            color: #8B5CF6;
        }
        
        .btn-fields:hover {
            background: #8B5CF6;
            color: white;
        }
        
        .btn-delete-product {
            background: rgba(244,67,54,0.1);
            color: #f44336;
        }
        
        .btn-delete-product:hover {
            background: #f44336;
            color: white;
        }
        
        .btn-toggle-product {
            background: rgba(76,175,80,0.1);
            color: #4CAF50;
        }
        
        .btn-toggle-product:hover {
            background: #4CAF50;
            color: white;
        }
        
        .btn-toggle-product.inactive {
            background: rgba(255,152,0,0.1);
            color: #FF9800;
        }
        
        .btn-toggle-product.inactive:hover {
            background: #FF9800;
            color: white;
        }
        
        .product-fields-count {
            margin-top: 8px;
            font-size: 12px;
            color: var(--gray);
        }
        
        .product-fields-count span {
            color: #8B5CF6;
            font-weight: 700;
        }
        
        /* ===== نموذج إضافة/تعديل منتج ===== */
        .product-form {
            background: var(--dark-light);
            border-radius: var(--radius);
            padding: 30px;
            border: 1px solid rgba(255,215,0,0.05);
            max-width: 700px;
            margin: 0 auto;
        }
        
        .product-form h3 {
            color: var(--gold);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        .form-group label {
            display: block;
            color: var(--gray);
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        .form-group label .required {
            color: #f44336;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            background: var(--dark);
            color: var(--white);
            border: 1px solid rgba(255,215,0,0.1);
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            transition: var(--transition);
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 0 3px rgba(255,215,0,0.1);
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: var(--dark);
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Cairo', sans-serif;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255,215,0,0.3);
        }
        
        .btn-cancel {
            width: 100%;
            padding: 14px;
            background: transparent;
            color: var(--gray);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Cairo', sans-serif;
            margin-top: 10px;
        }
        
        .btn-cancel:hover {
            border-color: var(--gray);
            color: var(--white);
        }
        
        /* ===== إدارة الحقول المخصصة لمنتج ===== */
        .fields-manager {
            background: var(--dark-light);
            border-radius: var(--radius);
            padding: 30px;
            border: 1px solid rgba(255,215,0,0.05);
        }
        
        .fields-manager .product-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .fields-manager .product-info h3 {
            color: var(--gold);
            font-size: 20px;
        }
        
        .fields-manager .product-info .back-btn {
            color: var(--gray);
            text-decoration: none;
            transition: var(--transition);
        }
        
        .fields-manager .product-info .back-btn:hover {
            color: var(--gold);
        }
        
        .fields-list {
            margin-bottom: 25px;
        }
        
        .field-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--dark);
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid rgba(255,215,0,0.05);
            transition: var(--transition);
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .field-item:hover {
            border-color: rgba(255,215,0,0.15);
        }
        
        .field-item .field-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .field-item .field-name {
            font-weight: 600;
            color: var(--white);
        }
        
        .field-item .field-type {
            font-size: 12px;
            color: var(--gray);
            background: rgba(255,255,255,0.05);
            padding: 2px 10px;
            border-radius: 12px;
        }
        
        .field-item .field-required {
            font-size: 11px;
            color: #f44336;
        }
        
        .field-item .field-status {
            font-size: 11px;
        }
        
        .field-item .field-status.active {
            color: #4CAF50;
        }
        
        .field-item .field-status.inactive {
            color: #FF9800;
        }
        
        .field-item .field-actions {
            display: flex;
            gap: 6px;
        }
        
        .field-item .field-actions button {
            padding: 4px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 12px;
            font-weight: 600;
            transition: var(--transition);
        }
        
        .field-item .field-actions .btn-toggle-field {
            background: rgba(76,175,80,0.1);
            color: #4CAF50;
        }
        
        .field-item .field-actions .btn-toggle-field:hover {
            background: #4CAF50;
            color: white;
        }
        
        .field-item .field-actions .btn-toggle-field.inactive {
            background: rgba(255,152,0,0.1);
            color: #FF9800;
        }
        
        .field-item .field-actions .btn-toggle-field.inactive:hover {
            background: #FF9800;
            color: white;
        }
        
        .field-item .field-actions .btn-delete-field {
            background: rgba(244,67,54,0.1);
            color: #f44336;
        }
        
        .field-item .field-actions .btn-delete-field:hover {
            background: #f44336;
            color: white;
        }
        
        .add-field-form {
            background: var(--dark);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid rgba(255,215,0,0.05);
        }
        
        .add-field-form h4 {
            color: var(--gold);
            margin-bottom: 15px;
            font-size: 16px;
        }
        
        .add-field-form .form-row {
            grid-template-columns: 1fr 1fr 1fr;
        }
        
        .add-field-form .btn-add-field {
            padding: 10px 24px;
            background: linear-gradient(135deg, #8B5CF6, #6D28D9);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: var(--transition);
        }
        
        .add-field-form .btn-add-field:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139,92,246,0.3);
        }
        
        /* ===== Toast ===== */
        #toastContainer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 350px;
            width: 100%;
            direction: rtl;
        }
        
        .toast-item {
            background: #1A1A2E;
            color: #fff;
            padding: 12px 16px;
            border-radius: 12px;
            border-right: 4px solid #2196F3;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            font-size: 14px;
            animation: slideInRight 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: Cairo, sans-serif;
        }
        
        .toast-item.success { border-right-color: #4CAF50; }
        .toast-item.error { border-right-color: #f44336; }
        .toast-item.warning { border-right-color: #FF9800; }
        .toast-item.info { border-right-color: #2196F3; }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
        
        /* ===== فارغ ===== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--gray);
        }
        
        .empty-state i {
            font-size: 48px;
            display: block;
            margin-bottom: 15px;
            opacity: 0.3;
        }
        
        /* ===== ريسپونسيف ===== */
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .add-field-form .form-row {
                grid-template-columns: 1fr;
            }
            
            .admin-header {
                flex-direction: column;
                text-align: center;
            }
            
            .tabs {
                justify-content: center;
            }
            
            .tab-btn {
                padding: 8px 16px;
                font-size: 14px;
            }
            
            .products-grid-admin {
                grid-template-columns: 1fr;
            }
            
            .field-item {
                flex-direction: column;
                align-items: stretch;
            }
            
            .field-item .field-actions {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- ===== الهيدر ===== -->
    <div class="admin-header">
        <h1><i class="fas fa-shield-halved"></i> لوحة تحكم المنتجات</h1>
        <div class="header-actions">
            <a href="index.html"><i class="fas fa-arrow-right"></i> العودة للمتجر</a>
            <a href="admin-products.html" class="btn-add-product" onclick="showAddProduct()">
                <i class="fas fa-plus"></i> إضافة منتج
            </a>
        </div>
    </div>
    
    <!-- ===== التبويبات ===== -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('products')">
            <i class="fas fa-box"></i> المنتجات
        </button>
        <button class="tab-btn" onclick="switchTab('add-product')">
            <i class="fas fa-plus-circle"></i> إضافة منتج
        </button>
        <button class="tab-btn" onclick="switchTab('fields')" id="fieldsTabBtn" style="display:none;">
            <i class="fas fa-pencil-alt"></i> إدارة الحقول
        </button>
    </div>
    
    <!-- ===== تبويب المنتجات ===== -->
    <div id="tab-products" class="tab-content active">
        <div class="products-grid-admin" id="productsList">
            <!-- يتم تعبئتها بواسطة JavaScript -->
        </div>
    </div>
    
    <!-- ===== تبويب إضافة منتج ===== -->
    <div id="tab-add-product" class="tab-content">
        <div class="product-form">
            <h3 id="productFormTitle"><i class="fas fa-plus-circle"></i> إضافة منتج جديد</h3>
            <form id="productForm" onsubmit="saveProduct(event)">
                <input type="hidden" id="editProductId" />
                
                <div class="form-group">
                    <label>اسم المنتج <span class="required">*</span></label>
                    <input type="text" id="productName" placeholder="أدخل اسم المنتج" required />
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>السعر (ر.س) <span class="required">*</span></label>
                        <input type="number" id="productPrice" placeholder="0" required min="0" step="0.01" />
                    </div>
                    <div class="form-group">
                        <label>المخزون <span class="required">*</span></label>
                        <input type="number" id="productStock" placeholder="0" required min="0" />
                    </div>
                </div>
                
                <div class="form-group">
                    <label>التصنيف</label>
                    <input type="text" id="productCategory" placeholder="مثال: كلاسيكي" />
                </div>
                
                <div class="form-group">
                    <label>وصف المنتج</label>
                    <textarea id="productDescription" placeholder="أدخل وصف المنتج"></textarea>
                </div>
                
                <div class="form-group">
                    <label>رابط الصورة</label>
                    <input type="url" id="productImage" placeholder="https://example.com/image.jpg" />
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label style="display:flex;align-items:center;gap:8px;">
                            <input type="checkbox" id="productActive" checked />
                            مفعل
                        </label>
                    </div>
                    <div class="form-group">
                        <label style="display:flex;align-items:center;gap:8px;">
                            <input type="checkbox" id="productCustom" />
                            منتج مخصص
                        </label>
                    </div>
                </div>
                
                <button type="submit" class="btn-submit" id="submitProductBtn">
                    <i class="fas fa-save"></i> حفظ المنتج
                </button>
                <button type="button" class="btn-cancel" onclick="cancelProductForm()">
                    <i class="fas fa-times"></i> إلغاء
                </button>
            </form>
        </div>
    </div>
    
    <!-- ===== تبويب إدارة الحقول ===== -->
    <div id="tab-fields" class="tab-content">
        <div class="fields-manager">
            <div class="product-info">
                <h3 id="fieldsProductTitle"><i class="fas fa-pencil-alt"></i> إدارة الحقول المخصصة</h3>
                <a href="#" class="back-btn" onclick="switchTab('products')">
                    <i class="fas fa-arrow-right"></i> العودة للمنتجات
                </a>
            </div>
            
            <div class="fields-list" id="fieldsList">
                <!-- يتم تعبئتها بواسطة JavaScript -->
            </div>
            
            <div class="add-field-form">
                <h4><i class="fas fa-plus-circle"></i> إضافة حقل مخصص</h4>
                <form onsubmit="addField(event)">
                    <input type="hidden" id="fieldProductId" />
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>اسم الحقل <span class="required">*</span></label>
                            <input type="text" id="fieldName" placeholder="مثال: اسم على الدرع" required />
                        </div>
                        <div class="form-group">
                            <label>نوع الحقل <span class="required">*</span></label>
                            <select id="fieldType" required>
                                <option value="text">نص قصير</option>
                                <option value="textarea">نص طويل</option>
                                <option value="select">قائمة منسدلة</option>
                                <option value="file">رفع ملف</option>
                                <option value="color">اختيار لون</option>
                                <option value="date">تاريخ</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>ترتيب العرض</label>
                            <input type="number" id="fieldOrder" value="0" min="0" />
                        </div>
                    </div>
                    
                    <div class="form-group" id="fieldOptionsGroup" style="display:none;">
                        <label>خيارات القائمة (مفصولة بفاصلة)</label>
                        <input type="text" id="fieldOptions" placeholder="خيار1, خيار2, خيار3" />
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>نص مساعد</label>
                            <input type="text" id="fieldHelp" placeholder="مثال: اكتب الاسم الذي تريده" />
                        </div>
                        <div class="form-group">
                            <label>مكان الحجز</label>
                            <input type="text" id="fieldPlaceholder" placeholder="مثال: أدخل اسمك..." />
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label style="display:flex;align-items:center;gap:8px;">
                                <input type="checkbox" id="fieldRequired" checked />
                                حقل مطلوب
                            </label>
                        </div>
                        <div class="form-group">
                            <label style="display:flex;align-items:center;gap:8px;">
                                <input type="checkbox" id="fieldActive" checked />
                                مفعل
                            </label>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-add-field">
                        <i class="fas fa-plus"></i> إضافة الحقل
                    </button>
                </form>
            </div>
        </div>
    </div>
    
</div>

<!-- ===== Toast Container ===== -->
<div id="toastContainer"></div>

<script>
    // ============================================
    // اتصال Supabase
    // ============================================
    const supabaseUrl = 'https://savtqajghyloevzwrzvt.supabase.co';
    const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhdnRxYWpnaHlsb2V2endyenZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3ODA1OTMsImV4cCI6MjA5ODM1NjU5M30.CBq7eKyr3RR11op_SevMBBcKQNKF7uftpaa-URemEww';
    const supabase = createClient(supabaseUrl, supabaseAnonKey);
    
    let products = [];
    let currentProductId = null;
    let editingProductId = null;
    
    // ============================================
    // Toast
    // ============================================
    function showToast(message, type = 'info') {
        const container = document.getElementById('toastContainer');
        if (!container) return;
        
        const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
        const toast = document.createElement('div');
        toast.className = `toast-item ${type}`;
        toast.innerHTML = `<span>${icons[type] || 'ℹ️'}</span><span>${message}</span>`;
        container.appendChild(toast);
        
        setTimeout(() => {
            toast.style.animation = 'slideOutRight 0.3s ease';
            setTimeout(() => toast.remove(), 300);
        }, 3500);
    }
    
    // ============================================
    // التبويبات
    // ============================================
    function switchTab(tab) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(`tab-${tab}`).classList.add('active');
        
        // العثور على الزر المناسب
        document.querySelectorAll('.tab-btn').forEach(btn => {
            if (btn.textContent.includes('المنتجات') && tab === 'products') btn.classList.add('active');
            if (btn.textContent.includes('إضافة منتج') && tab === 'add-product') btn.classList.add('active');
            if (btn.textContent.includes('إدارة الحقول') && tab === 'fields') btn.classList.add('active');
        });
        
        if (tab === 'products') {
            document.getElementById('fieldsTabBtn').style.display = 'none';
            loadProducts();
        }
    }
    
    // ============================================
    // تحميل المنتجات
    // ============================================
    async function loadProducts() {
        try {
            const { data, error } = await supabase
                .from('products')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) throw error;
            
            products = data || [];
            renderProducts();
        } catch (error) {
            console.error('خطأ في تحميل المنتجات:', error);
            showToast('❌ خطأ في تحميل المنتجات', 'error');
        }
    }
    
    // ============================================
    // عرض المنتجات
    // ============================================
    async function renderProducts() {
        const container = document.getElementById('productsList');
        
        if (!products || products.length === 0) {
            container.innerHTML = `
                <div class="empty-state" style="grid-column:1/-1;">
                    <i class="fas fa-box-open"></i>
                    <p>لا توجد منتجات. أضف منتجاً جديداً!</p>
                </div>
            `;
            return;
        }
        
        // جلب عدد الحقول لكل منتج
        let fieldsCount = {};
        try {
            const { data } = await supabase.from('product_custom_fields').select('product_id');
            if (data) {
                fieldsCount = data.reduce((acc, item) => {
                    acc[item.product_id] = (acc[item.product_id] || 0) + 1;
                    return acc;
                }, {});
            }
        } catch (e) {}
        
        container.innerHTML = products.map(product => {
            const fieldCount = fieldsCount[product.id] || 0;
            
            return `
                <div class="product-card-admin">
                    <div class="product-header">
                        <span class="product-name">${product.name}</span>
                        <span class="product-price">${product.price} ر.س</span>
                    </div>
                    <div class="product-meta">
                        ${product.category ? `🏷️ ${product.category}` : 'غير مصنف'} | 
                        📦 ${product.stock || 0} قطعة |
                        ${product.is_active !== false ? '🟢 مفعل' : '🔴 غير مفعل'}
                        ${product.isCustom ? ' | 🎨 مخصص' : ''}
                    </div>
                    <div class="product-fields-count">
                        <i class="fas fa-pencil-alt"></i> 
                        <span>${fieldCount}</span> حقل مخصص
                        <button class="btn-fields" onclick="manageFields('${product.id}', '${product.name}')" style="margin-right:8px;padding:2px 10px;border:none;border-radius:4px;cursor:pointer;font-family:Cairo,sans-serif;font-size:12px;background:rgba(139,92,246,0.1);color:#8B5CF6;">
                            <i class="fas fa-edit"></i> إدارة
                        </button>
                    </div>
                    <div class="product-actions">
                        <button class="btn-edit-product" onclick="editProduct('${product.id}')">
                            <i class="fas fa-edit"></i> تعديل
                        </button>
                        <button class="btn-toggle-product ${product.is_active !== false ? '' : 'inactive'}" 
                                onclick="toggleProduct('${product.id}', ${product.is_active !== false})">
                            <i class="fas ${product.is_active !== false ? 'fa-toggle-on' : 'fa-toggle-off'}"></i>
                            ${product.is_active !== false ? 'إلغاء تفعيل' : 'تفعيل'}
                        </button>
                        <button class="btn-delete-product" onclick="deleteProduct('${product.id}')">
                            <i class="fas fa-trash"></i> حذف
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }
    
    // ============================================
    // إضافة منتج
    // ============================================
    function showAddProduct() {
        document.getElementById('editProductId').value = '';
        document.getElementById('productFormTitle').innerHTML = '<i class="fas fa-plus-circle"></i> إضافة منتج جديد';
        document.getElementById('submitProductBtn').innerHTML = '<i class="fas fa-save"></i> حفظ المنتج';
        document.getElementById('productForm').reset();
        document.getElementById('productActive').checked = true;
        switchTab('add-product');
    }
    
    // ============================================
    // حفظ المنتج
    // ============================================
    async function saveProduct(e) {
        e.preventDefault();
        
        const id = document.getElementById('editProductId').value;
        const name = document.getElementById('productName').value.trim();
        const price = parseFloat(document.getElementById('productPrice').value);
        const stock = parseInt(document.getElementById('productStock').value);
        const category = document.getElementById('productCategory').value.trim();
        const description = document.getElementById('productDescription').value.trim();
        const image_url = document.getElementById('productImage').value.trim();
        const is_active = document.getElementById('productActive').checked;
        const isCustom = document.getElementById('productCustom').checked;
        
        if (!name || !price || isNaN(stock)) {
            showToast('⚠️ الرجاء ملء جميع الحقول المطلوبة', 'warning');
            return;
        }
        
        const productData = {
            name,
            price,
            stock,
            category: category || null,
            description: description || null,
            image_url: image_url || null,
            is_active,
            isCustom,
            currency: 'SAR'
        };
        
        try {
            let result;
            
            if (id) {
                // تعديل
                result = await supabase
                    .from('products')
                    .update(productData)
                    .eq('id', id);
            } else {
                // إضافة
                result = await supabase
                    .from('products')
                    .insert(productData);
            }
            
            if (result.error) throw result.error;
            
            showToast(id ? '✅ تم تحديث المنتج بنجاح' : '✅ تم إضافة المنتج بنجاح', 'success');
            document.getElementById('productForm').reset();
            switchTab('products');
            loadProducts();
            
        } catch (error) {
            console.error('خطأ في حفظ المنتج:', error);
            showToast('❌ حدث خطأ: ' + error.message, 'error');
        }
    }
    
    // ============================================
    // تعديل منتج
    // ============================================
    async function editProduct(productId) {
        try {
            const { data, error } = await supabase
                .from('products')
                .select('*')
                .eq('id', productId)
                .single();
            
            if (error) throw error;
            
            document.getElementById('editProductId').value = data.id;
            document.getElementById('productName').value = data.name;
            document.getElementById('productPrice').value = data.price;
            document.getElementById('productStock').value = data.stock;
            document.getElementById('productCategory').value = data.category || '';
            document.getElementById('productDescription').value = data.description || '';
            document.getElementById('productImage').value = data.image_url || '';
            document.getElementById('productActive').checked = data.is_active !== false;
            document.getElementById('productCustom').checked = data.isCustom || false;
            
            document.getElementById('productFormTitle').innerHTML = '<i class="fas fa-edit"></i> تعديل المنتج';
            document.getElementById('submitProductBtn').innerHTML = '<i class="fas fa-save"></i> تحديث المنتج';
            
            switchTab('add-product');
            
        } catch (error) {
            console.error('خطأ في تحميل المنتج:', error);
            showToast('❌ حدث خطأ في تحميل المنتج', 'error');
        }
    }
    
    // ============================================
    // إلغاء نموذج المنتج
    // ============================================
    function cancelProductForm() {
        document.getElementById('productForm').reset();
        switchTab('products');
    }
    
    // ============================================
    // تبديل حالة المنتج
    // ============================================
    async function toggleProduct(productId, currentStatus) {
        try {
            const { error } = await supabase
                .from('products')
                .update({ is_active: !currentStatus })
                .eq('id', productId);
            
            if (error) throw error;
            
            showToast('✅ تم تحديث حالة المنتج', 'success');
            loadProducts();
        } catch (error) {
            console.error('خطأ في تبديل الحالة:', error);
            showToast('❌ حدث خطأ', 'error');
        }
    }
    
    // ============================================
    // حذف منتج
    // ============================================
    async function deleteProduct(productId) {
        if (!confirm('⚠️ هل أنت متأكد من حذف هذا المنتج؟ سيتم حذف جميع الحقول المرتبطة به.')) return;
        
        try {
            // حذف الحقول المرتبطة أولاً
            await supabase
                .from('product_custom_fields')
                .delete()
                .eq('product_id', productId);
            
            // ثم حذف المنتج
            const { error } = await supabase
                .from('products')
                .delete()
                .eq('id', productId);
            
            if (error) throw error;
            
            showToast('✅ تم حذف المنتج', 'success');
            loadProducts();
        } catch (error) {
            console.error('خطأ في حذف المنتج:', error);
            showToast('❌ حدث خطأ: ' + error.message, 'error');
        }
    }
    
    // ============================================
    // إدارة الحقول المخصصة
    // ============================================
    async function manageFields(productId, productName) {
        currentProductId = productId;
        document.getElementById('fieldProductId').value = productId;
        document.getElementById('fieldsProductTitle').innerHTML = `
            <i class="fas fa-pencil-alt"></i> إدارة الحقول المخصصة: ${productName}
        `;
        
        // عرض تبويب الحقول
        document.getElementById('fieldsTabBtn').style.display = 'inline-block';
        switchTab('fields');
        
        // تحميل الحقول
        await loadFields(productId);
    }
    
    // ============================================
    // تحميل الحقول
    // ============================================
    async function loadFields(productId) {
        try {
            const { data, error } = await supabase
                .from('product_custom_fields')
                .select('*')
                .eq('product_id', productId)
                .order('display_order', { ascending: true });
            
            if (error) throw error;
            
            const container = document.getElementById('fieldsList');
            
            if (!data || data.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-pencil-alt"></i>
                        <p>لا توجد حقول مخصصة لهذا المنتج. أضف حقلاً الآن!</p>
                    </div>
                `;
                return;
            }
            
            const typeLabels = {
                text: '📝 نص قصير',
                textarea: '📄 نص طويل',
                select: '📋 قائمة منسدلة',
                file: '📎 رفع ملف',
                color: '🎨 اختيار لون',
                date: '📅 تاريخ'
            };
            
            container.innerHTML = data.map(field => `
                <div class="field-item">
                    <div class="field-info">
                        <span class="field-name">${field.field_name}</span>
                        <span class="field-type">${typeLabels[field.field_type] || field.field_type}</span>
                        ${field.is_required ? '<span class="field-required">مطلوب</span>' : ''}
                        <span class="field-status ${field.is_active ? 'active' : 'inactive'}">
                            ${field.is_active ? '🟢 مفعل' : '🔴 غير مفعل'}
                        </span>
                        ${field.options ? `<span class="field-type" style="background:rgba(255,215,0,0.05);">${field.options}</span>` : ''}
                    </div>
                    <div class="field-actions">
                        <button class="btn-toggle-field ${field.is_active ? '' : 'inactive'}" 
                                onclick="toggleField('${field.id}', ${field.is_active})">
                            <i class="fas ${field.is_active ? 'fa-toggle-on' : 'fa-toggle-off'}"></i>
                        </button>
                        <button class="btn-delete-field" onclick="deleteField('${field.id}')">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            
        } catch (error) {
            console.error('خطأ في تحميل الحقول:', error);
            showToast('❌ خطأ في تحميل الحقول', 'error');
        }
    }
    
    // ============================================
    // إضافة حقل
    // ============================================
    async function addField(e) {
        e.preventDefault();
        
        const productId = document.getElementById('fieldProductId').value;
        const fieldName = document.getElementById('fieldName').value.trim();
        const fieldType = document.getElementById('fieldType').value;
        const displayOrder = parseInt(document.getElementById('fieldOrder').value) || 0;
        const helpText = document.getElementById('fieldHelp').value.trim();
        const placeholder = document.getElementById('fieldPlaceholder').value.trim();
        const isRequired = document.getElementById('fieldRequired').checked;
        const isActive = document.getElementById('fieldActive').checked;
        const options = document.getElementById('fieldOptions').value.trim();
        
        if (!fieldName) {
            showToast('⚠️ الرجاء إدخال اسم الحقل', 'warning');
            return;
        }
        
        try {
            const { data, error } = await supabase
                .from('product_custom_fields')
                .insert({
                    product_id: productId,
                    field_name: fieldName,
                    field_type: fieldType,
                    display_order: displayOrder,
                    help_text: helpText || null,
                    placeholder: placeholder || null,
                    is_required: isRequired,
                    is_active: isActive,
                    options: fieldType === 'select' ? (options || null) : null
                })
                .select();
            
            if (error) throw error;
            
            showToast('✅ تم إضافة الحقل بنجاح', 'success');
            document.getElementById('fieldName').value = '';
            document.getElementById('fieldOptions').value = '';
            document.getElementById('fieldHelp').value = '';
            document.getElementById('fieldPlaceholder').value = '';
            document.getElementById('fieldOrder').value = '0';
            
            await loadFields(productId);
            
        } catch (error) {
            console.error('خطأ في إضافة الحقل:', error);
            showToast('❌ حدث خطأ: ' + error.message, 'error');
        }
    }
    
    // ============================================
    // تبديل حالة الحقل
    // ============================================
    async function toggleField(fieldId, currentStatus) {
        try {
            const { error } = await supabase
                .from('product_custom_fields')
                .update({ is_active: !currentStatus })
                .eq('id', fieldId);
            
            if (error) throw error;
            
            showToast('✅ تم تحديث حالة الحقل', 'success');
            await loadFields(currentProductId);
        } catch (error) {
            console.error('خطأ في تبديل الحالة:', error);
            showToast('❌ حدث خطأ', 'error');
        }
    }
    
    // ============================================
    // حذف حقل
    // ============================================
    async function deleteField(fieldId) {
        if (!confirm('⚠️ هل أنت متأكد من حذف هذا الحقل؟')) return;
        
        try {
            const { error } = await supabase
                .from('product_custom_fields')
                .delete()
                .eq('id', fieldId);
            
            if (error) throw error;
            
            showToast('✅ تم حذف الحقل', 'success');
            await loadFields(currentProductId);
        } catch (error) {
            console.error('خطأ في حذف الحقل:', error);
            showToast('❌ حدث خطأ', 'error');
        }
    }
    
    // ============================================
    // إظهار/إخفاء خيارات القائمة
    // ============================================
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('fieldType').addEventListener('change', function() {
            const optionsGroup = document.getElementById('fieldOptionsGroup');
            optionsGroup.style.display = this.value === 'select' ? 'block' : 'none';
        });
        
        // تحميل المنتجات
        loadProducts();
    });
</script>

</body>
</html>
