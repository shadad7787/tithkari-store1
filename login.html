<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول - Tithkari</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #8B0000;
            --gold: #FFD700;
            --gold-light: #FFED4A;
            --dark: #0F0F1A;
            --dark-light: #1A1A2E;
            --gray: #8A8A9B;
            --light: #F5F0EB;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--dark);
            color: var(--light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
            background: linear-gradient(135deg, var(--dark), var(--dark-light));
            padding: 20px;
        }
        
        .login-container {
            background: var(--dark-light);
            padding: 50px 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-logo i {
            font-size: 50px;
            color: var(--gold);
        }
        
        .login-logo h1 {
            color: var(--gold);
            font-size: 28px;
            margin-top: 10px;
        }
        
        .login-logo p {
            color: var(--gray);
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--gray);
            font-weight: 600;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            background: var(--dark);
            color: var(--light);
            border: 1px solid rgba(255, 215, 0, 0.1);
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.05);
        }
        
        .form-group input::placeholder {
            color: var(--gray);
            opacity: 0.5;
        }
        
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: var(--dark);
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .login-error {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid #F44336;
            color: #F44336;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }
        
        .login-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            color: #10b981;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }
        
        .login-footer {
            text-align: center;
            margin-top: 20px;
            color: var(--gray);
            font-size: 13px;
        }
        
        .login-footer a {
            color: var(--gold);
            text-decoration: none;
            transition: all 0.3s;
        }
        
        .login-footer a:hover {
            color: var(--gold-light);
        }
        
        .login-back {
            display: inline-block;
            margin-top: 15px;
            color: var(--gray);
            text-decoration: none;
            transition: all 0.3s;
        }
        
        .login-back:hover {
            color: var(--gold);
        }
        
        .login-loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: var(--gold);
        }
        
        .login-loading.show {
            display: block;
        }
        
        .login-loading i {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }
            .login-logo i {
                font-size: 40px;
            }
            .login-logo h1 {
                font-size: 24px;
            }
            .btn-primary {
                font-size: 16px;
                padding: 12px;
            }
        }
        
        .password-wrapper {
            position: relative;
        }
        
        .password-wrapper input {
            padding-left: 45px;
        }
        
        .password-toggle {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--gray);
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s;
        }
        
        .password-toggle:hover {
            color: var(--gold);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo">
            <i class="fas fa-shield-halved"></i>
            <h1>Tithkari</h1>
            <p>تسجيل الدخول إلى لوحة التحكم</p>
        </div>
        
        <div id="loginError" class="login-error"></div>
        <div id="loginSuccess" class="login-success"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label>📧 البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="admin@tithkari.com" required autocomplete="email" />
            </div>
            <div class="form-group">
                <label>🔑 كلمة المرور</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
                    <button type="button" class="password-toggle" onclick="togglePassword()">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-primary" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
            </button>
        </form>
        
        <div class="login-loading" id="loginLoading">
            <i class="fas fa-spinner"></i> جاري تسجيل الدخول...
        </div>
        
        <div class="login-footer">
            <p>⚠️ للمطورين فقط: حساب الأدمن</p>
            <p style="font-size:12px;color:var(--gray);margin-top:5px;">
                البريد: <strong>admin@tithkari.com</strong> | كلمة المرور: <strong>Admin@123456</strong>
            </p>
            <a href="index.html" class="login-back">
                <i class="fas fa-arrow-right"></i> العودة إلى المتجر
            </a>
        </div>
    </div>
    
    <script>
        // ============================================
        // دالة عرض/إخفاء كلمة المرور
        // ============================================
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                eyeIcon.className = 'fas fa-eye';
            }
        }
        window.togglePassword = togglePassword;
    </script>
    
    <!-- ===== كود تسجيل الدخول المدمج (بدون import) ===== -->
    <script>
        // ============================================
        // إعدادات Supabase - ضع بيانات مشروعك هنا
        // ============================================
        const SUPABASE_URL = 'https://savtqajghyloevzwrzvt.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhdnRxYWpnaHlsb2V2endyenZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3ODA1OTMsImV4cCI6MjA5ODM1NjU5M30.CBq7eKyr3RR11op_SevMBBcKQNKF7uftpaa-URemEww';
        
        // ============================================
        // عناصر DOM
        // ============================================
        const form = document.getElementById('loginForm');
        const errorDiv = document.getElementById('loginError');
        const successDiv = document.getElementById('loginSuccess');
        const loadingDiv = document.getElementById('loginLoading');
        const loginBtn = document.getElementById('loginBtn');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        
        // ============================================
        // دالة تسجيل الدخول
        // ============================================
        async function handleLogin(event) {
            event.preventDefault();
            
            // إخفاء الرسائل السابقة
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            // إظهار مؤشر التحميل
            loadingDiv.classList.add('show');
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحميل...';
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            // التحقق من المدخلات
            if (!email || !password) {
                showError('⚠️ الرجاء إدخال البريد الإلكتروني وكلمة المرور');
                resetButton();
                return;
            }
            
            try {
                console.log('📝 محاولة تسجيل الدخول:', email);
                
                // ✅ تحميل Supabase بشكل ديناميكي
                const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2.39.0');
                const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                
                // ✅ محاولة تسجيل الدخول
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (error) {
                    console.error('❌ خطأ:', error);
                    throw error;
                }
                
                console.log('✅ تم تسجيل الدخول بنجاح:', data.user.email);
                
                // ✅ حفظ الجلسة
                localStorage.setItem('user', JSON.stringify(data.user));
                localStorage.setItem('session', JSON.stringify(data.session));
                
                // ✅ عرض رسالة نجاح
                successDiv.textContent = '✅ تم تسجيل الدخول بنجاح! جاري التوجيه...';
                successDiv.style.display = 'block';
                loginBtn.innerHTML = '✅ جاري التوجيه...';
                
                // ✅ التوجيه إلى لوحة التحكم
                setTimeout(() => {
                    window.location.href = 'admin/admin.html';
                }, 1000);
                
            } catch (error) {
                console.error('❌ خطأ:', error);
                
                let errorMessage = '❌ فشل تسجيل الدخول. ';
                
                if (error.message.includes('Invalid login credentials')) {
                    errorMessage = '❌ البريد الإلكتروني أو كلمة المرور غير صحيحة';
                } else if (error.message.includes('Email not confirmed')) {
                    errorMessage = '❌ الرجاء تأكيد البريد الإلكتروني أولاً';
                } else if (error.message.includes('network') || error.message.includes('fetch')) {
                    errorMessage = '❌ تحقق من الاتصال بالإنترنت وحاول مرة أخرى';
                } else {
                    errorMessage += error.message;
                }
                
                showError(errorMessage);
                resetButton();
            }
        }
        
        // ============================================
        // دوال مساعدة
        // ============================================
        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        function resetButton() {
            loadingDiv.classList.remove('show');
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
        }
        
        // ============================================
        // ربط النموذج
        // ============================================
        form.addEventListener('submit', handleLogin);
        
        // تسجيل الدخول بالضغط على Enter
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                form.dispatchEvent(new Event('submit'));
            }
        });
        
        console.log('✅ صفحة تسجيل الدخول جاهزة');
    </script>
</body>
</html>
