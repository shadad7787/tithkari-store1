<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>تسجيل الدخول - Tithkari</title>
    
    <!-- ===== 📱 Meta Tags للجوال ===== -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tithkari - تسجيل الدخول" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0F0F1A" />
    <meta name="format-detection" content="telephone=no" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <style>
        /* ===== إعادة تعيين وتحسينات أساسية ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        
        :root {
            --primary: #8B0000;
            --gold: #FFD700;
            --gold-light: #FFED4A;
            --dark: #0F0F1A;
            --dark-light: #1A1A2E;
            --gray: #8A8A9B;
            --gray-light: #B0B0C0;
            --light: #F5F0EB;
            --radius: 20px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--dark);
            color: var(--light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
            background: linear-gradient(135deg, var(--dark), var(--dark-light));
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
            touch-action: manipulation;
        }
        
        .login-container {
            background: var(--dark-light);
            padding: 50px 40px;
            border-radius: var(--radius);
            border: 1px solid rgba(255, 215, 0, 0.1);
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.5s ease;
            position: relative;
            overflow: hidden;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* ===== شعار الصفحة ===== */
        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-logo i {
            font-size: 50px;
            color: var(--gold);
            display: block;
            margin: 0 auto 10px;
        }
        
        .login-logo h1 {
            color: var(--gold);
            font-size: 28px;
            margin-top: 5px;
            font-weight: 800;
        }
        
        .login-logo p {
            color: var(--gray);
            font-size: 14px;
            margin-top: 4px;
        }
        
        /* ===== الرسائل ===== */
        .login-error {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid #F44336;
            color: #F44336;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
            text-align: center;
            min-height: 48px;
            word-break: break-word;
        }
        
        .login-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            color: #10b981;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
            text-align: center;
            min-height: 48px;
            word-break: break-word;
        }
        
        /* ===== النموذج ===== */
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--gray);
            font-weight: 600;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            background: var(--dark);
            color: var(--light);
            border: 1px solid rgba(255, 215, 0, 0.08);
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            transition: var(--transition);
            min-height: 48px;
            touch-action: manipulation;
        }
        
        .form-group input:focus {
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.05);
        }
        
        .form-group input::placeholder {
            color: var(--gray);
            opacity: 0.5;
        }
        
        .form-group .help-text {
            font-size: 12px;
            color: var(--gray);
            margin-top: 4px;
        }
        
        /* ===== صف النموذج ===== */
        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .form-row .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--gray);
            font-size: 14px;
            cursor: pointer;
            touch-action: manipulation;
            min-height: 36px;
        }
        
        .form-row .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--gold);
            cursor: pointer;
            flex-shrink: 0;
            min-width: 18px;
            min-height: 18px;
            touch-action: manipulation;
        }
        
        .form-row .forgot-link {
            color: var(--gold);
            font-size: 13px;
            text-decoration: none;
            transition: var(--transition);
            touch-action: manipulation;
            min-height: 36px;
            display: flex;
            align-items: center;
        }
        
        .form-row .forgot-link:hover {
            color: var(--gold-light);
        }
        
        .form-row .forgot-link:active {
            transform: scale(0.97);
        }
        
        /* ===== زر تسجيل الدخول ===== */
        .btn-primary {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: var(--dark);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 52px;
            touch-action: manipulation;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
        }
        
        .btn-primary:active {
            transform: scale(0.97);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        
        /* ===== مؤشر التحميل ===== */
        .login-loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: var(--gold);
            min-height: 24px;
        }
        
        .login-loading.show {
            display: block;
        }
        
        .login-loading i {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* ===== حقل كلمة المرور مع زر الإظهار ===== */
        .password-wrapper {
            position: relative;
        }
        
        .password-wrapper input {
            padding-left: 48px;
        }
        
        .password-toggle {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--gray);
            cursor: pointer;
            font-size: 18px;
            transition: var(--transition);
            min-height: 40px;
            min-width: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        
        .password-toggle:hover {
            color: var(--gold);
        }
        
        .password-toggle:active {
            transform: translateY(-50%) scale(0.95);
        }
        
        /* ===== بيانات المطور ===== */
        .dev-credentials {
            background: rgba(255, 215, 0, 0.03);
            border: 1px dashed rgba(255, 215, 0, 0.15);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            margin-top: 20px;
            text-align: center;
        }
        
        .dev-credentials p {
            color: var(--gray);
            font-size: 12px;
            margin: 0;
            line-height: 1.8;
        }
        
        .dev-credentials strong {
            color: var(--gold);
            font-weight: 700;
        }
        
        /* ===== تذييل الصفحة ===== */
        .login-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 215, 0, 0.05);
        }
        
        .login-footer p {
            color: var(--gray);
            font-size: 13px;
        }
        
        .login-footer .register-link {
            color: var(--gold);
            text-decoration: none;
            transition: var(--transition);
            font-weight: 600;
            touch-action: manipulation;
            min-height: 36px;
            display: inline-flex;
            align-items: center;
        }
        
        .login-footer .register-link:hover {
            color: var(--gold-light);
        }
        
        .login-footer .register-link:active {
            transform: scale(0.97);
        }
        
        .login-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            color: var(--gray);
            text-decoration: none;
            transition: var(--transition);
            font-size: 14px;
            touch-action: manipulation;
            min-height: 36px;
        }
        
        .login-back:hover {
            color: var(--gold);
        }
        
        .login-back:active {
            transform: scale(0.97);
        }
        
        /* ============================================
           📱 تحسينات الجوال
           ============================================ */
        
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
                border-radius: 16px;
                max-width: 100%;
                margin: 0 4px;
            }
            
            .login-logo i {
                font-size: 40px;
            }
            
            .login-logo h1 {
                font-size: 24px;
            }
            
            .login-logo p {
                font-size: 13px;
            }
            
            .btn-primary {
                font-size: 16px;
                padding: 12px 16px;
                min-height: 48px;
            }
            
            .form-group input {
                font-size: 15px;
                padding: 12px 14px;
                min-height: 44px;
            }
            
            .form-row {
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }
            
            .form-row .forgot-link {
                justify-content: center;
                min-height: 32px;
            }
            
            .form-row .remember-me {
                justify-content: center;
                min-height: 32px;
            }
            
            .form-row .remember-me input[type="checkbox"] {
                width: 20px;
                height: 20px;
                min-width: 20px;
                min-height: 20px;
            }
            
            .login-error,
            .login-success {
                font-size: 13px;
                padding: 10px 12px;
                min-height: 40px;
            }
            
            .password-toggle {
                min-height: 36px;
                min-width: 36px;
                font-size: 16px;
            }
            
            .dev-credentials {
                padding: 10px 12px;
            }
            
            .dev-credentials p {
                font-size: 11px;
            }
            
            .login-footer p {
                font-size: 12px;
            }
            
            .login-back {
                font-size: 13px;
                min-height: 32px;
            }
        }
        
        @media (max-width: 360px) {
            .login-container {
                padding: 20px 14px;
                border-radius: 12px;
            }
            
            .login-logo i {
                font-size: 32px;
            }
            
            .login-logo h1 {
                font-size: 20px;
            }
            
            .btn-primary {
                font-size: 14px;
                padding: 10px 14px;
                min-height: 44px;
            }
            
            .form-group input {
                font-size: 14px;
                padding: 10px 12px;
                min-height: 40px;
            }
            
            .form-group label {
                font-size: 13px;
            }
            
            .login-error,
            .login-success {
                font-size: 12px;
                padding: 8px 10px;
                min-height: 36px;
            }
            
            .password-toggle {
                min-height: 32px;
                min-width: 32px;
                font-size: 14px;
            }
        }
        
        /* ===== تحسينات اللمس للجوال ===== */
        @media (hover: none) and (pointer: coarse) {
            .btn-primary,
            .password-toggle,
            .login-back,
            .register-link,
            .forgot-link,
            .form-row .remember-me {
                min-height: 44px;
                touch-action: manipulation;
            }
            
            .btn-primary:hover {
                transform: none;
            }
            
            .btn-primary:active {
                transform: scale(0.97);
            }
            
            .login-back:hover {
                color: var(--gray);
            }
            
            .login-back:active {
                color: var(--gold);
                transform: scale(0.97);
            }
            
            .forgot-link:hover {
                color: var(--gold);
            }
            
            .forgot-link:active {
                transform: scale(0.97);
            }
            
            .register-link:hover {
                color: var(--gold);
            }
            
            .register-link:active {
                transform: scale(0.97);
            }
        }
        
        /* ===== تحسينات إمكانية الوصول ===== */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
        
        /* ===== تحسينات العرض في الوضع الأفقي ===== */
        @media (max-height: 600px) and (orientation: landscape) {
            .login-container {
                padding: 20px 30px;
                max-width: 500px;
            }
            
            .login-logo {
                margin-bottom: 15px;
            }
            
            .login-logo i {
                font-size: 32px;
            }
            
            .login-logo h1 {
                font-size: 20px;
            }
            
            .form-group {
                margin-bottom: 12px;
            }
            
            .form-group input {
                min-height: 38px;
                padding: 10px 14px;
            }
            
            .btn-primary {
                min-height: 42px;
                padding: 10px 16px;
                font-size: 16px;
            }
            
            .login-footer {
                margin-top: 12px;
                padding-top: 12px;
            }
        }
        
        /* ===== تحسينات للشاشات الكبيرة ===== */
        @media (min-width: 769px) {
            .login-container {
                padding: 60px 50px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo">
            <i class="fas fa-shield-halved"></i>
            <h1>Tithkari</h1>
            <p>تسجيل الدخول إلى لوحة التحكم</p>
        </div>
        
        <div id="loginError" class="login-error"></div>
        <div id="loginSuccess" class="login-success"></div>
        
        <form id="loginForm" novalidate>
            <div class="form-group">
                <label>📧 البريد الإلكتروني</label>
                <input type="email" id="loginEmail" placeholder="admin@tithkari.com" required autocomplete="email" />
            </div>
            <div class="form-group">
                <label>🔑 كلمة المرور</label>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password" />
                    <button type="button" class="password-toggle" onclick="togglePassword()" aria-label="إظهار/إخفاء كلمة المرور">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>
            
            <div class="form-row">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe" checked />
                    <span>تذكرني</span>
                </label>
                <a href="#" class="forgot-link" onclick="handleForgotPassword(event)">نسيت كلمة المرور؟</a>
            </div>
            
            <button type="submit" class="btn-primary" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
            </button>
        </form>
        
        <div class="login-loading" id="loginLoading">
            <i class="fas fa-spinner"></i> جاري تسجيل الدخول...
        </div>
        
        <div class="dev-credentials">
            <p>⚠️ للمطورين فقط: حساب الأدمن</p>
            <p style="font-size:12px;color:var(--gray);margin-top:3px;">
                البريد: <strong>admin@tithkari.com</strong> | كلمة المرور: <strong>Admin@123456</strong>
            </p>
        </div>
        
        <div class="login-footer">
            <p>ليس لديك حساب؟ <a href="#" class="register-link" onclick="handleRegister(event)">إنشاء حساب جديد</a></p>
            <a href="index.html" class="login-back">
                <i class="fas fa-arrow-right"></i> العودة إلى المتجر
            </a>
        </div>
    </div>
    
    <script type="module">
        // ============================================
        // استيراد المفاتيح من keys.example.js
        // ============================================
        import KEYS from './keys.example.js';

        console.log('🔐 Keys loaded from keys.example.js');

        // ============================================
        // إعدادات Supabase - مستوردة من keys.example.js
        // ============================================
        const SUPABASE_URL = KEYS.supabaseUrl;
        const SUPABASE_ANON_KEY = KEYS.supabaseAnonKey;
        
        // ============================================
        // دالة عرض/إخفاء كلمة المرور
        // ============================================
        window.togglePassword = function() {
            const passwordInput = document.getElementById('loginPassword');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                eyeIcon.className = 'fas fa-eye';
            }
        };
        
        // ============================================
        // دوال مساعدة
        // ============================================
        function showToast(message, type = 'info') {
            const colors = { 
                success: '#4CAF50', 
                error: '#f44336', 
                warning: '#FF9800', 
                info: '#2196F3' 
            };
            
            const toast = document.createElement('div');
            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: #1A1A2E;
                color: #fff;
                padding: 12px 24px;
                border-radius: 12px;
                border-right: 4px solid ${colors[type] || '#2196F3'};
                box-shadow: 0 8px 32px rgba(0,0,0,0.4);
                font-size: 14px;
                z-index: 99999;
                font-family: 'Cairo', sans-serif;
                display: flex;
                align-items: center;
                gap: 10px;
                direction: rtl;
                animation: slideDown 0.3s ease;
                max-width: 90%;
                min-height: 48px;
            `;
            toast.innerHTML = `<span>${icons[type] || 'ℹ️'}</span><span>${message}</span>`;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(-20px)';
                toast.style.transition = 'all 0.4s ease';
                setTimeout(() => toast.remove(), 400);
            }, 3500);
        }
        window.showToast = showToast;
        
        window.handleForgotPassword = function(event) {
            event.preventDefault();
            showToast('📧 سيتم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني', 'info');
        };
        
        window.handleRegister = function(event) {
            event.preventDefault();
            showToast('🔧 هذه الميزة قيد التطوير حالياً', 'warning');
        };

        // ============================================
        // عناصر DOM
        // ============================================
        const form = document.getElementById('loginForm');
        const errorDiv = document.getElementById('loginError');
        const successDiv = document.getElementById('loginSuccess');
        const loadingDiv = document.getElementById('loginLoading');
        const loginBtn = document.getElementById('loginBtn');
        const emailInput = document.getElementById('loginEmail');
        const passwordInput = document.getElementById('loginPassword');
        const rememberMeCheck = document.getElementById('rememberMe');
        
        // ============================================
        // دالة تسجيل الدخول
        // ============================================
        async function handleLogin(event) {
            event.preventDefault();
            
            // إخفاء الرسائل السابقة
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            // إظهار مؤشر التحميل
            loadingDiv.classList.add('show');
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحميل...';
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const rememberMe = rememberMeCheck.checked;
            
            // التحقق من المدخلات
            if (!email || !password) {
                errorDiv.textContent = '⚠️ الرجاء إدخال البريد الإلكتروني وكلمة المرور';
                errorDiv.style.display = 'block';
                resetButton();
                return;
            }
            
            try {
                console.log('📝 محاولة تسجيل الدخول:', email);
                
                // ✅ تحميل Supabase بشكل ديناميكي باستخدام المفاتيح المستوردة
                const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2.39.0');
                const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                
                // ✅ محاولة تسجيل الدخول
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (error) {
                    console.error('❌ خطأ:', error);
                    throw error;
                }
                
                console.log('✅ تم تسجيل الدخول بنجاح:', data.user.email);
                
                // ✅ حفظ الجلسة
                if (rememberMe) {
                    localStorage.setItem('remember_me', 'true');
                } else {
                    localStorage.removeItem('remember_me');
                }
                localStorage.setItem('user', JSON.stringify(data.user));
                localStorage.setItem('session', JSON.stringify(data.session));
                
                // ✅ عرض رسالة نجاح
                successDiv.textContent = '✅ تم تسجيل الدخول بنجاح! جاري التوجيه...';
                successDiv.style.display = 'block';
                loginBtn.innerHTML = '✅ جاري التوجيه...';
                
                // ✅ التوجيه إلى لوحة التحكم
                setTimeout(() => {
                    window.location.href = 'admin/admin.html';
                }, 800);
                
            } catch (error) {
                console.error('❌ خطأ:', error);
                
                let errorMessage = '❌ فشل تسجيل الدخول. ';
                
                if (error.message.includes('Invalid login credentials')) {
                    errorMessage = '❌ البريد الإلكتروني أو كلمة المرور غير صحيحة';
                } else if (error.message.includes('Email not confirmed')) {
                    errorMessage = '❌ الرجاء تأكيد البريد الإلكتروني أولاً';
                } else if (error.message.includes('network') || error.message.includes('fetch')) {
                    errorMessage = '❌ تحقق من الاتصال بالإنترنت وحاول مرة أخرى';
                } else {
                    errorMessage += error.message;
                }
                
                errorDiv.textContent = errorMessage;
                errorDiv.style.display = 'block';
                resetButton();
            }
        }
        
        // ============================================
        // دوال مساعدة
        // ============================================
        function resetButton() {
            loadingDiv.classList.remove('show');
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
        }
        
        // ============================================
        // التحقق من الجلسة عند تحميل الصفحة
        // ============================================
        async function checkExistingSession() {
            try {
                const sessionStr = localStorage.getItem('session');
                if (!sessionStr) return;
                
                const session = JSON.parse(sessionStr);
                if (!session.access_token) return;
                
                // التحقق من صلاحية التوكن
                const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2.39.0');
                const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                
                const { data, error } = await supabase.auth.getUser(session.access_token);
                if (data?.user && !error) {
                    console.log('✅ جلسة نشطة موجودة، التوجيه إلى لوحة التحكم');
                    window.location.href = 'admin/admin.html';
                }
            } catch (e) {
                console.log('⚠️ لا توجد جلسة نشطة');
            }
        }
        
        // ============================================
        // ربط النموذج
        // ============================================
        form.addEventListener('submit', handleLogin);
        
        // تسجيل الدخول بالضغط على Enter
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                form.dispatchEvent(new Event('submit'));
            }
        });
        
        // ============================================
        // تهيئة الصفحة
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 صفحة تسجيل الدخول جاهزة');
            console.log('🔐 Keys loaded from keys.example.js');
            
            // ملء البريد وكلمة المرور في حالة وجود تذكرني
            const rememberMe = localStorage.getItem('remember_me');
            if (rememberMe === 'true') {
                const savedEmail = localStorage.getItem('saved_email');
                if (savedEmail) {
                    emailInput.value = savedEmail;
                    rememberMeCheck.checked = true;
                }
            }
            
            // التحقق من الجلسة
            checkExistingSession();
        });
        
        // حفظ البريد الإلكتروني عند تغييره
        emailInput.addEventListener('change', function() {
            if (rememberMeCheck.checked) {
                localStorage.setItem('saved_email', this.value);
            }
        });
        
        console.log('✅ صفحة تسجيل الدخول جاهزة');
    </script>
</body>
</html>
